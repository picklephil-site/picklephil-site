<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PickleOS 93</title>
<meta name="description" content="PickleOS 93 — a briny little desktop OS parody, right in your browser." />
<link rel="icon" type="image/png" href="/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bevel-light:#ffffff; --bevel-dark:#404040; --face:#c0c0c0; --face-dark:#808080;
    --titlebar-a:#0c3a22; --titlebar-b:#2ecc71;
    --desktop-a:#0a4a2c; --desktop-b:#062617;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    font-family:Tahoma,"Segoe UI",Verdana,sans-serif; font-size:13px; color:#111;
    -webkit-user-select:none; user-select:none;
  }
  ::selection{background:#2ecc71;color:#fff}
  button{font-family:inherit; font-size:inherit;}
  .pixel{ font-family:"Press Start 2P", monospace; }

  /* ---------- BOOT SCREEN ---------- */
  #boot{
    position:fixed; inset:0; background:#000; color:#33ff66; z-index:9999;
    font-family:"Press Start 2P", monospace; font-size:11px; line-height:1.9;
    padding:26px; overflow:hidden; cursor:pointer;
  }
  #boot .line{opacity:0; white-space:pre-wrap;}
  #boot .cursor{display:inline-block; width:8px; height:12px; background:#33ff66; vertical-align:-2px; animation:blink 1s steps(1) infinite;}
  #boot-bar-wrap{margin-top:22px; width:min(420px,80vw); border:2px solid #33ff66; padding:3px;}
  #boot-bar{height:12px; width:0%; background:#33ff66; transition:width .25s linear;}
  #boot-skip{position:absolute; bottom:18px; right:22px; font-size:9px; opacity:.6;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* ---------- DESKTOP ---------- */
  #desktop{
    position:fixed; inset:0; overflow:hidden;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 34px),
      radial-gradient(1100px 700px at 85% 0%, rgba(46,204,113,.20), transparent 60%),
      linear-gradient(160deg, var(--desktop-a) 0%, var(--desktop-b) 100%);
    display:none;
  }
  #desktop-watermark{
    position:absolute; right:18px; bottom:54px; font-size:11px; color:rgba(255,255,255,.28);
    pointer-events:none; text-align:right; line-height:1.6;
  }

  .desktop-icons{
    position:absolute; top:14px; left:10px; bottom:52px; right:10px;
    display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;
    gap:2px; overflow:hidden;
  }
  .dicon{
    width:82px; height:84px; padding:6px 4px; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:4px; border:1px dashed transparent; border-radius:3px; cursor:pointer;
    background:none;
  }
  .dicon:active, .dicon.selected{ background:rgba(46,204,113,.28); border-color:rgba(255,255,255,.4); }
  .dicon .di-emoji{font-size:30px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));}
  .dicon .di-label{color:#fff; font-size:11.5px; text-align:center; line-height:1.25; text-shadow:1px 1px 1px #000, 0 0 4px rgba(0,0,0,.8);}

  /* ---------- WINDOW ---------- */
  #windows-layer{position:absolute; inset:0 0 44px 0; pointer-events:none;}
  .win{
    pointer-events:auto;
    position:absolute; min-width:220px; min-height:140px;
    background:var(--face); border-top:2px solid var(--bevel-light); border-left:2px solid var(--bevel-light);
    border-bottom:2px solid var(--bevel-dark); border-right:2px solid var(--bevel-dark);
    box-shadow:3px 3px 10px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden;
  }
  .win.maximized{ inset:0 !important; width:auto !important; height:auto !important; }
  .win.minimized{ display:none; }
  .win-titlebar{
    background:linear-gradient(90deg, var(--titlebar-a), var(--titlebar-b));
    color:#fff; padding:3px 4px 3px 6px; display:flex; align-items:center; gap:6px;
    font-weight:700; cursor:default; flex:0 0 auto; touch-action:none;
  }
  .win-titlebar .wt-icon{font-size:14px;}
  .win-titlebar .wt-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px;}
  .win-controls{display:flex; gap:2px;}
  .wbtn{
    width:19px; height:18px; background:var(--face); border-top:1px solid var(--bevel-light); border-left:1px solid var(--bevel-light);
    border-bottom:1px solid var(--bevel-dark); border-right:1px solid var(--bevel-dark);
    font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#111; font-weight:900;
  }
  .wbtn:active{ border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark); border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light);}
  .win-body{flex:1; overflow:auto; background:#ece9e2; position:relative;}
  .win-body.pad{padding:12px;}
  .win-body iframe{width:100%; height:100%; border:0; display:block; background:#fff;}
  .win-resize{position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; touch-action:none;}
  .win-resize::after{content:""; position:absolute; right:2px; bottom:2px; width:8px; height:8px;
    background:repeating-linear-gradient(135deg, var(--bevel-dark) 0 1px, transparent 1px 3px);}

  /* ---------- TASKBAR ---------- */
  #taskbar{
    position:absolute; left:0; right:0; bottom:0; height:40px; background:var(--face);
    border-top:2px solid #fff; display:flex; align-items:center; gap:6px; padding:3px 6px; z-index:5000;
  }
  #start-btn{
    display:flex; align-items:center; gap:5px; padding:4px 10px; font-weight:800; font-size:13px;
    background:var(--face); border-top:1px solid var(--bevel-light); border-left:1px solid var(--bevel-light);
    border-bottom:1px solid var(--bevel-dark); border-right:1px solid var(--bevel-dark); cursor:pointer;
  }
  #start-btn.active, #start-btn:active{ border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark); border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light); background:#d8f5e3; }
  #taskbar-sep{width:2px; height:28px; border-left:1px solid var(--bevel-dark); border-right:1px solid var(--bevel-light); margin:0 2px;}
  #task-buttons{flex:1; display:flex; gap:4px; overflow-x:auto; height:30px;}
  .task-btn{
    display:flex; align-items:center; gap:5px; padding:3px 10px; max-width:180px; font-size:12px;
    background:var(--face); border-top:1px solid var(--bevel-light); border-left:1px solid var(--bevel-light);
    border-bottom:1px solid var(--bevel-dark); border-right:1px solid var(--bevel-dark); cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .task-btn.active{ border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark); border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light); background:#d8f5e3;}
  #tray{
    display:flex; align-items:center; gap:8px; padding:2px 10px; font-size:11.5px;
    border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark);
    border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light); height:26px;
  }
  #mute-btn{cursor:pointer; font-size:14px;}

  /* ---------- START MENU ---------- */
  #start-menu{
    position:absolute; left:2px; bottom:42px; width:230px; background:var(--face);
    border-top:2px solid var(--bevel-light); border-left:2px solid var(--bevel-light);
    border-bottom:2px solid var(--bevel-dark); border-right:2px solid var(--bevel-dark);
    box-shadow:3px 3px 10px rgba(0,0,0,.5); display:none; z-index:6000; overflow:hidden;
  }
  #start-menu.open{display:flex;}
  #start-banner{
    writing-mode:vertical-rl; transform:rotate(180deg); background:linear-gradient(180deg,var(--titlebar-a),var(--titlebar-b));
    color:#fff; font-weight:900; padding:10px 6px; font-size:15px; letter-spacing:2px; text-align:center;
  }
  #start-items{flex:1; padding:4px; max-height:70vh; overflow-y:auto;}
  .sm-item, .sm-sub-toggle{
    display:flex; align-items:center; gap:8px; padding:6px 8px; cursor:pointer; font-size:12.5px; border-radius:1px;
  }
  .sm-item:hover, .sm-sub-toggle:hover{ background:var(--titlebar-a); color:#fff; }
  .sm-emoji{width:20px; text-align:center; font-size:15px;}
  .sm-sep{height:1px; border-top:1px solid var(--bevel-dark); border-bottom:1px solid var(--bevel-light); margin:4px 2px;}
  .sm-sub{display:none; padding-left:10px;}
  .sm-sub.open{display:block;}
  .sm-arrow{margin-left:auto; opacity:.6; font-size:10px;}

  /* ---------- SCREENSAVER ---------- */
  #screensaver{position:fixed; inset:0; background:#000; z-index:8000; display:none; cursor:pointer;}
  #ss-canvas{width:100%; height:100%; display:block;}

  /* ---------- DIALOGS (error / shutdown / confirm) ---------- */
  .dlg-overlay{position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:7000; display:flex; align-items:center; justify-content:center;}
  .dlg{
    width:min(360px,88vw); background:var(--face);
    border-top:2px solid var(--bevel-light); border-left:2px solid var(--bevel-light);
    border-bottom:2px solid var(--bevel-dark); border-right:2px solid var(--bevel-dark);
    box-shadow:4px 4px 14px rgba(0,0,0,.55);
  }
  .dlg-title{background:linear-gradient(90deg,var(--titlebar-a),var(--titlebar-b)); color:#fff; font-weight:800; padding:4px 8px; font-size:12.5px; display:flex; justify-content:space-between;}
  .dlg-body{padding:16px; display:flex; gap:14px; align-items:flex-start;}
  .dlg-emoji{font-size:32px;}
  .dlg-msg{font-size:12.5px; line-height:1.5;}
  .dlg-actions{display:flex; gap:8px; justify-content:flex-end; padding:0 16px 14px;}
  .dlg-btn{
    padding:5px 16px; background:var(--face); font-size:12px; cursor:pointer;
    border-top:1px solid var(--bevel-light); border-left:1px solid var(--bevel-light);
    border-bottom:1px solid var(--bevel-dark); border-right:1px solid var(--bevel-dark);
  }
  .dlg-btn:active{ border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark); border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light);}

  /* ---------- SHUTDOWN SCREEN ---------- */
  #shutdown-screen{position:fixed; inset:0; background:#0c3a22; color:#fff; z-index:9500; display:none; align-items:center; justify-content:center; text-align:center; flex-direction:column; gap:16px;}
  #shutdown-screen .pixel{font-size:14px; line-height:1.9;}

  /* ---------- Generic content styling ---------- */
  .app-h1{margin:0 0 8px; font-size:15px;}
  .app-p{line-height:1.55; font-size:12.5px;}
  .win-body a{color:#0c3a22; font-weight:700;}
  .field-set{border:1px solid var(--bevel-dark); border-top-color:var(--bevel-light); border-left-color:var(--bevel-light); padding:10px; margin-bottom:10px;}
  .field-set legend{font-weight:800; padding:0 4px;}
  .win-btn2{ padding:5px 14px; background:var(--face); cursor:pointer;
    border-top:1px solid var(--bevel-light); border-left:1px solid var(--bevel-light);
    border-bottom:1px solid var(--bevel-dark); border-right:1px solid var(--bevel-dark); font-size:12px;}
  .win-btn2:active{ border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark); border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light);}
  .inset-box{ background:#fff; border-top:1px solid var(--bevel-dark); border-left:1px solid var(--bevel-dark);
    border-bottom:1px solid var(--bevel-light); border-right:1px solid var(--bevel-light); padding:8px; }

  /* My Computer tree */
  .tree{font-size:12.5px; line-height:1.9;}
  .tree .node{cursor:pointer; padding:1px 4px; border-radius:2px;}
  .tree .node:hover{background:#cde8d6;}
  .tree .indent{padding-left:20px;}

  /* Paint */
  .paint-app{display:flex; flex-direction:column; height:100%;}
  .paint-toolbar{display:flex; align-items:center; gap:6px; padding:6px; background:var(--face); border-bottom:2px solid var(--bevel-dark); flex-wrap:wrap; flex:0 0 auto;}
  .swatch{width:20px; height:20px; border:1px solid #333; cursor:pointer; flex:0 0 auto;}
  .paint-wrap{position:relative; flex:1 1 auto; background:#fff; min-height:0;}
  #paint-canvas{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none;}

  /* Terminal */
  .term{background:#000; color:#33ff66; font-family:"Press Start 2P",monospace; font-size:10.5px; line-height:1.8; height:100%; padding:8px; overflow-y:auto;}
  .term-line{white-space:pre-wrap; word-break:break-word;}
  .term-input-row{display:flex; gap:6px;}
  .term-input{flex:1; background:transparent; border:none; color:#33ff66; font-family:inherit; font-size:inherit; outline:none;}

  /* Radio */
  .radio-face{padding:16px; text-align:center;}
  .radio-screen{background:#08210f; color:#33ff66; font-family:"Press Start 2P",monospace; font-size:10px; padding:10px; margin-bottom:14px; overflow:hidden; white-space:nowrap;}
  .radio-marquee{display:inline-block; padding-left:100%; animation:marquee 9s linear infinite;}
  @keyframes marquee{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
  .radio-btn{font-size:20px; width:42px; height:36px; margin:0 3px;}

  /* Minesweeper */
  .mine-head{display:flex; align-items:center; justify-content:space-between; background:var(--face); padding:6px; border-bottom:2px solid var(--bevel-dark);}
  .mine-counter{background:#000; color:#f00; font-family:"Press Start 2P",monospace; font-size:13px; padding:3px 6px; letter-spacing:1px;}
  .mine-face{width:30px; height:30px; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--face); border-top:2px solid var(--bevel-light); border-left:2px solid var(--bevel-light);
    border-bottom:2px solid var(--bevel-dark); border-right:2px solid var(--bevel-dark);}
  .mine-grid{display:grid; gap:0; padding:8px; justify-content:center;}
  .mine-cell{width:24px; height:24px; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--face); border-top:2px solid var(--bevel-light); border-left:2px solid var(--bevel-light);
    border-bottom:2px solid var(--bevel-dark); border-right:2px solid var(--bevel-dark); user-select:none;}
  .mine-cell.revealed{ border:1px solid var(--bevel-dark); background:#d4d0c8; cursor:default; }
  .mine-cell.mine.revealed{ background:#e74c3c; }

  /* Snake */
  .snake-wrap{display:flex; flex-direction:column; align-items:center; height:100%; padding:8px; gap:6px; outline:none;}
  #snake-canvas{background:#08210f; border:2px solid; border-color:var(--bevel-dark) var(--bevel-light) var(--bevel-light) var(--bevel-dark);}
  .snake-pad{display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(2,34px); gap:4px; margin-top:4px;}
  .snake-pad button{grid-column:2;}
  .snake-pad button:nth-child(2){grid-column:1; grid-row:2;}
  .snake-pad button:nth-child(3){grid-column:3; grid-row:2;}

  /* TV */
  .tv-body{display:flex; flex-direction:column; height:100%; background:#1a1a1a;}
  .tv-screen{flex:1; position:relative; background:#000; overflow:hidden; margin:10px; border:6px solid #333; border-radius:6px;}
  .tv-screen canvas{position:absolute; inset:0; width:100%; height:100%;}
  .tv-content{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:14px; color:#fff; font-weight:800;}
  .tv-controls{flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px; background:#111;}
  .tv-controls button{font-size:14px;}
  .tv-label{position:absolute; top:6px; left:10px; font-family:"Press Start 2P",monospace; font-size:9px; color:#0f0; text-shadow:0 0 4px #0f0; opacity:.85;}
  @keyframes dance{0%,100%{transform:translateX(0) rotate(-6deg)}50%{transform:translateX(14px) rotate(6deg)}}

  /* Browser */
  .browser-app{display:flex; flex-direction:column; height:100%;}
  .browser-toolbar{flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:5px; background:var(--face); border-bottom:2px solid var(--bevel-dark);}
  .browser-addr{flex:1; padding:4px 6px; font-size:12px;}
  .browser-content{flex:1; overflow:auto; background:#fff; position:relative;}
  .browser-content iframe{width:100%; height:100%; border:0;}
  .browser-page{padding:20px; font-size:13px; line-height:1.6;}
  .browser-page h1{margin-top:0;}
  .portal-link{display:inline-block; margin:4px 6px 4px 0; padding:6px 12px; background:#e8f5ea; border:1px solid #0c3a22; border-radius:4px; cursor:pointer; font-weight:700; color:#0c3a22;}

  /* Context menu */
  .ctx-menu{
    position:fixed; min-width:170px; background:var(--face);
    border-top:2px solid var(--bevel-light); border-left:2px solid var(--bevel-light);
    border-bottom:2px solid var(--bevel-dark); border-right:2px solid var(--bevel-dark);
    box-shadow:3px 3px 10px rgba(0,0,0,.5); z-index:6800; padding:3px;
  }

  /* BSOD */
  #bsod-screen{
    position:fixed; inset:0; background:#0000aa; color:#fff; z-index:9800; display:none;
    align-items:center; justify-content:center; padding:40px;
  }
  #bsod-screen .bsod-inner{max-width:640px; font-family:"Press Start 2P",monospace; font-size:11px; line-height:2.1; white-space:pre-wrap;}

  /* Popup ads */
  .ad-popup{
    position:fixed; width:220px; background:linear-gradient(135deg,#fff200,#ff8a00); color:#200; border:3px solid #000;
    border-radius:4px; padding:10px 24px 10px 10px; font-weight:800; font-size:12px; box-shadow:0 10px 26px rgba(0,0,0,.5);
    z-index:7500; animation:adPulse 1.1s ease-in-out infinite; line-height:1.4;
  }
  .ad-popup .ad-close{position:absolute; top:1px; right:5px; cursor:pointer; font-weight:900; font-size:14px;}
  @keyframes adPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

  /* Visitor counter */
  #visitor-counter{
    position:absolute; right:18px; bottom:120px; text-align:right; pointer-events:none;
  }
  #visitor-counter .odo{
    background:#000; color:#39ff14; font-family:"Press Start 2P",monospace; font-size:13px; letter-spacing:2px;
    padding:4px 8px; border:2px solid #333; display:inline-block; margin-top:3px;
  }
  #visitor-counter .odo-label{color:rgba(255,255,255,.5); font-size:10px;}

  @media (max-width:640px){
    .dicon{width:74px; height:80px;}
    .dicon .di-emoji{font-size:26px;}
    .dicon .di-label{font-size:10.5px;}
    #start-menu{width:210px;}
  }
</style>
</head>
<body>

<!-- ================= BOOT SCREEN ================= -->
<div id="boot">
  <div id="boot-lines"></div>
  <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
  <div id="boot-skip">click / tap anywhere to skip →</div>
</div>

<!-- ================= DESKTOP ================= -->
<div id="desktop">
  <div id="desktop-watermark" class="pixel">PickleOS<br>ver 9.3</div>
  <div id="visitor-counter"><div class="odo-label">visitors served:</div><div class="odo" id="visitor-num">000000</div></div>

  <div class="desktop-icons" id="desktop-icons"></div>

  <div id="windows-layer"></div>

  <div id="start-menu">
    <div id="start-banner">PickleOS 93</div>
    <div id="start-items"></div>
  </div>

  <div id="taskbar">
    <div id="start-btn"><span>🥒</span><span>Start</span></div>
    <div id="taskbar-sep"></div>
    <div id="task-buttons"></div>
    <div id="tray">
      <span id="mute-btn" title="Toggle sound">🔊</span>
      <span id="clock">12:00 PM</span>
    </div>
  </div>
</div>

<!-- ================= SCREENSAVER ================= -->
<div id="screensaver"><canvas id="ss-canvas"></canvas></div>

<!-- ================= SHUTDOWN SCREEN ================= -->
<div id="shutdown-screen">
  <div class="pixel" id="shutdown-text">Shutting down PickleOS...</div>
</div>

<!-- ================= BSOD ================= -->
<div id="bsod-screen">
  <div class="bsod-inner" id="bsod-text"></div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     SOUND — tiny WebAudio blips, no asset files needed
  ============================================================ */
  var soundOn = localStorage.getItem('pos_sound') !== 'off';
  var actx = null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function blip(freq, dur, type){
    if(!soundOn) return;
    var c = ac(); if(!c) return;
    try{
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(.05, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (dur||.12));
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + (dur||.12));
    }catch(e){}
  }
  function sndOpen(){ blip(520,.09); setTimeout(function(){blip(780,.09);},60); }
  function sndClose(){ blip(400,.09); setTimeout(function(){blip(220,.12);},50); }
  function sndClick(){ blip(660,.05); }
  function sndError(){ blip(160,.22,'sawtooth'); }

  /* ============================================================
     BOOT SEQUENCE
  ============================================================ */
  var bootLines = [
    "PickleOS(tm) 93 BIOS v3.14",
    "Copyright (C) The Real Dill Phil's Jar",
    "",
    "Detecting brine levels......... OK",
    "Checking jar integrity......... OK",
    "Mounting C:\\PICKLES............ OK",
    "Loading CLIPPYPICKLE.EXE....... OK",
    "Initializing crunch drivers.... OK",

  function makeDraggable(handle, winEl){
    var dragging=false, sx=0, sy=0, ox=0, oy=0;
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('.wbtn')) return;
      if(winEl.classList.contains('maximized')) return;
      dragging=true; sx=e.clientX; sy=e.clientY;
      var r = winEl.getBoundingClientRect(); ox=r.left; oy=r.top;
      handle.setPointerCapture(e.pointerId);
      focusWin(winEl.dataset.id);
    });
    handle.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var nx = ox + (e.clientX-sx), ny = oy + (e.clientY-sy);
      ny = Math.max(0, ny);
      winEl.style.left = nx+'px'; winEl.style.top = ny+'px';
    });
    function stop(){ dragging=false; }
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  }

  function makeResizable(handle, winEl){
    var resizing=false, sx=0, sy=0, ow=0, oh=0;
    handle.addEventListener('pointerdown', function(e){
      resizing=true; sx=e.clientX; sy=e.clientY;
      var r = winEl.getBoundingClientRect(); ow=r.width; oh=r.height;
      handle.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function(e){
      if(!resizing) return;
      winEl.style.width = Math.max(240, ow + (e.clientX-sx)) + 'px';
      winEl.style.height = Math.max(160, oh + (e.clientY-sy)) + 'px';

    handle.addEventListener('pointerup', stop);

  }

        for(var r=0;r<SIZE;r++){ var row=[]; for(var c=0;c<SIZE;c++) row.push({mine:false,revealed:false,flagged:false,count:0}); grid.push(row); }
        countEl.textContent = pad3(MINES-flags);
        timeEl.textContent = pad3(0);
        faceEl.textContent = '🥒';
        render();
      }

      function render(){
        gridEl.innerHTML = '';
        for(var r=0;r<SIZE;r++){
          for(var c=0;c<SIZE;c++){
            var cell = grid[r][c];
            var d = document.createElement('div');
            d.className = 'mine-cell' + (cell.revealed?' revealed':'') + (cell.revealed&&cell.mine?' mine':'');
            if(cell.revealed){
              if(cell.mine) d.textContent = '🥒';
              else if(cell.count>0){ d.textContent = cell.count; d.style.color = ['','#0000fe','#008100','#fe0000','#000084','#840000','#008180','#840084','#000'][cell.count]; d.style.fontWeight='900'; }
            } else if(cell.flagged) d.textContent = '🚩';
            (function(r,c,d){
              d.addEventListener('click', function(){ reveal(r,c); });
              d.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); toggleFlag(r,c); });
            })(r,c,d);
            gridEl.appendChild(d);
          }
        }
      }

      function toggleFlag(r,c){
        if(over || grid[r][c].revealed) return;
        grid[r][c].flagged = !grid[r][c].flagged;
        flags += grid[r][c].flagged ? 1 : -1;
        countEl.textContent = pad3(MINES-flags);
        sndClick();
        render();
      }

      function reveal(r,c){
        if(over || grid[r][c].flagged || grid[r][c].revealed) return;
        if(!started){
          started = true;
          placeMines(r,c);
          timer = setInterval(function(){ secs++; timeEl.textContent = pad3(secs); }, 1000);
        }
        var cell = grid[r][c];
        cell.revealed = true;
        if(cell.mine){
          over = true; clearInterval(timer); faceEl.textContent='💀'; sndError();
          for(var rr=0;rr<SIZE;rr++) for(var cc=0;cc<SIZE;cc++) if(grid[rr][cc].mine) grid[rr][cc].revealed=true;
          render();
          return;
        }
        if(cell.count===0){ neighbors(r,c).forEach(function(p){ if(!grid[p[0]][p[1]].revealed) reveal(p[0],p[1]); }); }
        var revealedCount=0, total=SIZE*SIZE-MINES;
        for(var rr2=0;rr2<SIZE;rr2++) for(var cc2=0;cc2<SIZE;cc2++) if(grid[rr2][cc2].revealed && !grid[rr2][cc2].mine) revealedCount++;
        if(revealedCount===total){ over=true; clearInterval(timer); faceEl.textContent='😎'; blip(880,.08); setTimeout(function(){blip(1100,.12);},90); }
        render();
      }

      faceEl.addEventListener('click', function(){ sndClick(); newGame(); });
      newGame();
    }
  };

    if(appId === 'notepad' && opts && opts.htmlOverride!==undefined){
      return _origOpenApp('notepad', opts);
    }
    return _origOpenApp(appId, opts);
  };

  /* ============================================================
     CONTEXT MENU (right-click desktop / icons, windows93-style)
  ============================================================ */
  function showCtxMenu(items, x, y){
    closeCtxMenu();
    var m = document.createElement('div'); m.className='ctx-menu'; m.id='ctx-menu';
    items.forEach(function(it){
      if(it==='-'){ var s=document.createElement('div'); s.className='sm-sep'; m.appendChild(s); return; }
      var row=document.createElement('div'); row.className='sm-item';
      row.innerHTML='<span class="sm-emoji">'+it.emoji+'</span><span>'+it.label+'</span>';
      row.addEventListener('click', function(){ closeCtxMenu(); if(it.onClick) it.onClick(); });
      m.appendChild(row);
    });
    document.body.appendChild(m);
    var vw=window.innerWidth, vh=window.innerHeight;
    var r = m.getBoundingClientRect();
    m.style.left = Math.max(2,Math.min(x, vw-r.width-4))+'px';
    m.style.top = Math.max(2,Math.min(y, vh-r.height-4))+'px';
  }
  function closeCtxMenu(){ var m=document.getElementById('ctx-menu'); if(m) m.remove(); }
  document.addEventListener('pointerdown', function(e){ if(!e.target.closest('.ctx-menu')) closeCtxMenu(); });

  function arrangeIcons(){
    for(var i=DESKTOP_ICONS.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=DESKTOP_ICONS[i]; DESKTOP_ICONS[i]=DESKTOP_ICONS[j]; DESKTOP_ICONS[j]=t; }
    buildDesktopIcons();
    sndClick();
  }
  function refreshDesktop(){
    var d = document.getElementById('desktop');
    d.style.filter = 'brightness(.35)';
    setTimeout(function(){ d.style.filter=''; }, 140);
    sndClick();
  }
  function newTextDoc(){
    DESKTOP_ICONS.push({app:null, emoji:'📄', label:'New Text Document.txt', customText:''});
    buildDesktopIcons();
    sndOpen();
  }

  /* ============================================================
     BSOD — the fatal (green) screen of death
  ============================================================ */
  function showBSOD(){
    closeStart(); closeCtxMenu();
    document.getElementById('desktop').style.display = 'none';
    var b = document.getElementById('bsod-screen');
    b.querySelector('#bsod-text') && (b.querySelector('#bsod-text').textContent =
      "PickleOS\n\n"+
      "A fatal exception 0E has occurred at 0028:C0011E36 in VXD\n"+
      "BRINE(01) + 00010E36. The current jar will be terminated.\n\n"+
      "*  Press any key to terminate the current pickle.\n"+
      "*  Press any key again to restart your computer. You will\n"+
      "   lose any unsaved brine in all open jars.\n\n"+
      "Press any key to continue _");
    b.style.display = 'flex';
    blip(110,.5,'sawtooth');
  }
  document.getElementById('bsod-screen').addEventListener('pointerdown', function(){ location.reload(); });
  document.addEventListener('keydown', function(e){
    if(document.getElementById('bsod-screen').style.display === 'flex') location.reload();
  });

  /* ============================================================
     POPUP ADS — rate-limited windows93-style banner gags
  ============================================================ */
  var AD_CONTENT = [
    "🎉 YOU ARE THE 1,000,000th VISITOR! 🎉<br>Click to claim your FREE PICKLE!",
    "💃 HOT SINGLE DILLS IN YOUR AREA 💃<br>(There's one. It's Phil.)",
    "⚠️ YOUR JAR MAY BE INFECTED ⚠️<br>Download BrineGuard Antivirus NOW",
    "💰 MAKE $$$ FAST 💰<br>Ask me how! (The answer is pickles.)",
    "🔔 NEW RINGTONES FOR YOUR JAR 🔔<br>Text PICKLE to 55555"
  ];
  var adsSpawnedTotal = 0, adsOpenNow = 0;
  var AD_LIFETIME_MAX = 5, AD_CONCURRENT_MAX = 2;
  function spawnAd(){
    if(adsSpawnedTotal >= AD_LIFETIME_MAX || adsOpenNow >= AD_CONCURRENT_MAX) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = 220, h = 110;
    var x = 20 + Math.random()*Math.max(20, vw-w-40);
    var y = 60 + Math.random()*Math.max(20, vh-h-140);
    var el = document.createElement('div'); el.className='ad-popup';
    el.style.left = x+'px'; el.style.top = y+'px';
    el.innerHTML = '<span class="ad-close">✕</span>'+AD_CONTENT[Math.floor(Math.random()*AD_CONTENT.length)];
    document.body.appendChild(el);
    adsSpawnedTotal++; adsOpenNow++;
    blip(500,.06); setTimeout(function(){blip(700,.06);},70);
    el.querySelector('.ad-close').addEventListener('click', function(){ el.remove(); adsOpenNow--; sndClick(); });
  }
  function scheduleAds(){
    setTimeout(function(){ spawnAd(); scheduleAds(); }, 45000 + Math.random()*45000);
  }

  /* ============================================================
     CURSOR TRAIL (Settings toggle)
  ============================================================ */
  var trailOn = localStorage.getItem('pos_trail') === 'on';
  var lastTrailAt = 0;
  document.addEventListener('pointermove', function(e){
    if(!trailOn) return;
    var now = e.timeStamp;
    if(now - lastTrailAt < 70) return;
    lastTrailAt = now;
    var s = document.createElement('span');
    s.textContent = '🥒';
    s.style.cssText = 'position:fixed;left:'+e.clientX+'px;top:'+e.clientY+'px;pointer-events:none;font-size:15px;z-index:9700;transition:transform .9s ease,opacity .9s ease;transform:translate(-50%,-50%);opacity:.9;';
    document.body.appendChild(s);
    requestAnimationFrame(function(){ s.style.transform='translate(-50%,-160%) scale(1.3)'; s.style.opacity='0'; });
    setTimeout(function(){ s.remove(); }, 950);
  });

  /* ============================================================
     DESKTOP ICONS + START MENU CONTENT
  ============================================================ */
  var DESKTOP_ICONS = [
    {app:'about', emoji:'🥒', label:'About Phil'},
    {app:'mycomputer', emoji:'🖥️', label:'My Computer'},
    {app:'recyclebin', emoji:'🗑️', label:'Recycle Bin'},
    {app:'paint', emoji:'🎨', label:'Pickle Paint'},
    {app:'terminal', emoji:'⌨️', label:'MS-Pickle Prompt'},
    {app:'radio', emoji:'📻', label:'Brine FM'},
    {app:'minesweeper', emoji:'🥒', label:'Pickle Sweeper'},
    {app:'snake', emoji:'🐍', label:'Brine Snake'},
    {app:'tv', emoji:'📺', label:'Pickle Vision TV'},
    {app:'browser', emoji:'🌐', label:'Pickle Explorer 93'},
    {app:'solitaire', emoji:'🃏', label:'Solitaire'},
    {app:'roast', emoji:'🔥', label:'Roast Gen'},
    {app:'guestbook', emoji:'📖', label:'Guestbook'},
    {app:'playground', emoji:'🎡', label:'Playground'},
    {app:'bsod-trigger', emoji:'💀', label:"Don't Click This.exe"}
  ];

  var START_PROGRAMS = [
    {app:'trivia', emoji:'🧠', label:'Dill Trivia'},
    {app:'dillchill', emoji:'🎬', label:'Dill & Chill'},
    {app:'brewlab', emoji:'☕', label:'The Brew Lab'},
    {app:'discgolf', emoji:'🥏', label:'Disc Golf Hub'},
    {app:'picklegrams', emoji:'📸', label:'PickleGrams'},
    {app:'checkers', emoji:'⭐', label:'Chinese Checkers'},
    {app:'bible', emoji:'📖', label:'Bible Reader'},
    {app:'archive', emoji:'🗄️', label:'Archive'}
  ];

  function buildDesktopIcons(){
    var wrap = document.getElementById('desktop-icons');
    wrap.innerHTML = '';
    DESKTOP_ICONS.forEach(function(ic, idx){
      var d = document.createElement('div');
      d.className = 'dicon'; d.dataset.idx = idx;
      d.innerHTML = '<div class="di-emoji">'+ic.emoji+'</div><div class="di-label">'+ic.label+'</div>';
      d.addEventListener('click', function(){
        sndClick();
        if(ic.customText !== undefined) openApp('notepad', {title:ic.label, htmlOverride:ic.customText});
        else if(ic.app === 'bsod-trigger'){
          showDialog({title:'PickleOS', emoji:'💀', msg:'Are you SURE you want to run this? It looks extremely unwise.', buttons:['Yes, I dare you','No, that\'s smart'],
            onButton:function(i){ if(i===0) showBSOD(); else showDialog({title:'PickleOS', emoji:'🥒', msg:'Wise choice.', buttons:['OK']}); }});
        }
        else openApp(ic.app);
      });
      d.addEventListener('contextmenu', function(e){
        e.preventDefault(); e.stopPropagation();
        showCtxMenu([
          {emoji:'📂', label:'Open', onClick:function(){ d.click(); }},
          {emoji:'✏️', label:'Rename', onClick:function(){
            var nv = prompt('Rename to:', DESKTOP_ICONS[idx].label);
            if(nv){ DESKTOP_ICONS[idx].label = nv; buildDesktopIcons(); }
          }},
          {emoji:'🗑️', label:'Delete', onClick:function(){
            showDialog({title:'Confirm Delete', emoji:'🗑️', msg:'Delete "'+DESKTOP_ICONS[idx].label+'"? This cannot be un-pickled.', buttons:['Yes','No'],
              onButton:function(i){ if(i===0){ DESKTOP_ICONS.splice(idx,1); buildDesktopIcons(); sndClose(); } }});
          }}
        ], e.clientX, e.clientY);
      });
      wrap.appendChild(d);
    });
  }

  function buildStartMenu(){
    var box = document.getElementById('start-items');
    function item(emoji, label, onClick, hasSub){
      var el = document.createElement('div');
      el.className = hasSub ? 'sm-sub-toggle' : 'sm-item';
      el.innerHTML = '<span class="sm-emoji">'+emoji+'</span><span>'+label+'</span>'+(hasSub?'<span class="sm-arrow">▶</span>':'');
      if(onClick) el.addEventListener('click', onClick);
      box.appendChild(el);
      return el;
    }
    function sep(){ var s=document.createElement('div'); s.className='sm-sep'; box.appendChild(s); }

    var progsToggle = item('📁', 'Programs', null, true);
    var progsSub = document.createElement('div'); progsSub.className='sm-sub';
    START_PROGRAMS.forEach(function(p){
      var pi = document.createElement('div'); pi.className='sm-item';
      pi.innerHTML = '<span class="sm-emoji">'+p.emoji+'</span><span>'+p.label+'</span>';
      pi.addEventListener('click', function(){ sndClick(); openApp(p.app); closeStart(); });
      progsSub.appendChild(pi);
    });
    box.appendChild(progsSub);
    progsToggle.addEventListener('click', function(){ progsSub.classList.toggle('open'); });

    item('📄', 'Documents', function(){ sndClick(); openApp('mycomputer'); closeStart(); });
    item('⚙️', 'Settings', function(){ sndClick(); openApp('settings'); closeStart(); });
    item('🔎', 'Find', function(){ sndClick(); openApp('find'); closeStart(); });
    item('🏃', 'Run...', function(){ sndClick(); openApp('run'); closeStart(); });
    sep();
    item('❓', 'About PickleOS', function(){ sndClick(); openApp('help'); closeStart(); });
    sep();
    item('⏻', 'Shut Down...', function(){ sndClick(); closeStart(); confirmShutdown(); });
  }

  function toggleStart(){
    var m = document.getElementById('start-menu');
    var btn = document.getElementById('start-btn');
    var open = !m.classList.contains('open');
    m.classList.toggle('open', open);
    btn.classList.toggle('active', open);
    if(open) sndClick();
  }
  function closeStart(){
    document.getElementById('start-menu').classList.remove('open');
    document.getElementById('start-btn').classList.remove('active');
  }

  function confirmShutdown(){
    showDialog({
      title:'Shut Down PickleOS', emoji:'⏻',
      msg:'Are you sure you want to shut down? All unsaved brine will be lost.',
      buttons:['Shut Down','Cancel'],
      onButton: function(i){ if(i===0) doShutdown(); }
    });
  }
  function doShutdown(){
    document.getElementById('desktop').style.display = 'none';
    var s = document.getElementById('shutdown-screen');
    s.style.display = 'flex';
    var txt = document.getElementById('shutdown-text');
    txt.textContent = 'Shutting down PickleOS...';
    setTimeout(function(){
      txt.innerHTML = "It's now safe to close this tab.<br><br>🥒";
      var btn = document.createElement('div');
      btn.className = 'win-btn2 pixel';
      btn.style.cssText = 'margin-top:10px;font-size:11px;';
      btn.textContent = 'Restart PickleOS';
      btn.addEventListener('click', function(){ location.reload(); });
      s.appendChild(btn);
    }, 1600);
  }

  /* ============================================================
     ERROR SPAWNER (random ambient chaos, windows93-style)
  ============================================================ */
  function maybeSpawnError(){
    if(Object.keys(openWins).length === 0) return;
    if(Math.random() > 0.5) return;
    showDialog({title:'PickleOS', emoji:'⚠️', msg: ERRORS[Math.floor(Math.random()*ERRORS.length)], buttons:['OK']});
  }

  /* ============================================================
     SCREENSAVER (idle -> bouncing pickle)
  ============================================================ */
  var idleTimer = null;
  var IDLE_MS = 50000;
  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showScreensaver, IDLE_MS);
  }
  var ssRunning = false, ssRAF = null;
  function showScreensaver(){
    var sc = document.getElementById('screensaver');
    sc.style.display = 'block';
    ssRunning = true;
    var canvas = document.getElementById('ss-canvas');
    var ctx = canvas.getContext('2d');
    function fit(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    fit();
    var x=80,y=80,vx=2.6,vy=2.1, colors=['#2ecc71','#e74c3c','#f1c40f','#3498db','#9b59b6','#ff7a00'], ci=0;
    function frame(){
      if(!ssRunning) return;
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
      x+=vx; y+=vy;
      var w=110;
      if(x<=0||x+w>=canvas.width){ vx=-vx; ci=(ci+1)%colors.length; }
      if(y<=0||y+w>=canvas.height){ vy=-vy; ci=(ci+1)%colors.length; }
      ctx.font = w+'px serif';
      ctx.fillStyle = colors[ci];
      ctx.fillText('🥒', x, y+w*0.85);
      ssRAF = requestAnimationFrame(frame);
    }
    frame();
    window.addEventListener('resize', fit);
  }
  function hideScreensaver(){
    if(!ssRunning) return;
    ssRunning = false;
    cancelAnimationFrame(ssRAF);
    document.getElementById('screensaver').style.display = 'none';
    resetIdle();
  }
  document.getElementById('screensaver').addEventListener('pointerdown', hideScreensaver);
  document.addEventListener('keydown', function(){ if(ssRunning) hideScreensaver(); else resetIdle(); });

  /* ============================================================
     INIT
  ============================================================ */
  function initDesktop(){
    var savedTheme = localStorage.getItem('pos_theme');
    if(savedTheme) applyTheme(savedTheme);
    document.getElementById('mute-btn').textContent = soundOn ? '🔊' : '🔇';

    buildDesktopIcons();
    buildStartMenu();

    // Desktop background right-click menu
    document.getElementById('desktop').addEventListener('contextmenu', function(e){
      if(e.target.closest('.dicon') || e.target.closest('.win') || e.target.closest('#taskbar') || e.target.closest('#start-menu')) return;
      e.preventDefault();
      showCtxMenu([
        {emoji:'🔀', label:'Arrange Icons', onClick:arrangeIcons},
        {emoji:'🔄', label:'Refresh', onClick:refreshDesktop},
        {emoji:'📄', label:'New Text Document', onClick:newTextDoc},
        '-',
        {emoji:'⚙️', label:'Properties', onClick:function(){ openApp('settings'); }}
      ], e.clientX, e.clientY);
    });

    // Visitor counter — classic geocities-style odometer
    var visits = parseInt(localStorage.getItem('pos_visits')||'41733',10) + 1;
    localStorage.setItem('pos_visits', visits);
    document.getElementById('visitor-num').textContent = String(visits).padStart(6,'0');

    // Ambient popup ad gag
    scheduleAds();

    document.getElementById('start-btn').addEventListener('click', toggleStart);
    document.addEventListener('pointerdown', function(e){
      var m = document.getElementById('start-menu'), btn = document.getElementById('start-btn');
      if(m.classList.contains('open') && !m.contains(e.target) && !btn.contains(e.target)) closeStart();
    });
    document.getElementById('mute-btn').addEventListener('click', function(){
      soundOn = !soundOn;
      localStorage.setItem('pos_sound', soundOn?'on':'off');
      document.getElementById('mute-btn').textContent = soundOn ? '🔊' : '🔇';
      if(soundOn) sndClick();
    });

    // Clock
    function tick(){
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes();
      var ampm = h>=12?'PM':'AM';
      h = h%12; if(h===0) h=12;
      document.getElementById('clock').textContent = h+':'+(m<10?'0':'')+m+' '+ampm;
    }
    tick(); setInterval(tick, 15000);

    // Ambient chaos: occasional random error dialog
    setInterval(maybeSpawnError, 90000);

    // Idle screensaver
    ['pointerdown','pointermove','keydown','wheel'].forEach(function(ev){
      document.addEventListener(ev, resetIdle, {passive:true});
    });
    resetIdle();

    // Welcome dialog on first-ever visit
    if(!localStorage.getItem('pos_seen')){
      localStorage.setItem('pos_seen','1');
      setTimeout(function(){
        showDialog({title:'Welcome', emoji:'🥒', msg:'Welcome to PickleOS 93! Double-check your brine settings, then double click (or tap) any icon to get started. Try the Start Menu too.', buttons:['Got it']});
      }, 500);
    }
  }

})();
