<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Playlist Converter — Pickle Lab</title>
<meta name="description" content="Convert a YouTube Music playlist to Spotify." />
<link rel="icon" type="image/png" href="/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c3a22; --bg2: #1c8a4e; --bg3: #072a18;
    --text: #f5f7f5;
    --accent: #2ecc71;
    --btnText: #0d3d24;
    --radius: 18px;
    --shadow: 0 18px 45px rgba(0,0,0,.40);
    --glass: rgba(255,255,255,.10);
    --glass-border: rgba(255,255,255,.22);
    --panel-a: rgba(46,204,113,.18);
    --panel-b: rgba(8,40,24,.28);
    --spotify: #1DB954;
    --youtube: #FF0000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Segoe UI, Tahoma, sans-serif; color: var(--text);
    background:
      radial-gradient(900px 600px at 78% 8%, rgba(46,204,113,.28), transparent 60%),
      radial-gradient(1100px 800px at 12% 0%, var(--bg2) 0%, transparent 55%),
      radial-gradient(circle at 50% 120%, #0f4a2c 0%, var(--bg3) 70%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg3) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .wrap { width: min(780px, 100%); margin: 0 auto; padding: 28px 22px 60px; }

  /* Header */
  .lab-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px;
  }
  .lab-logo {
    font-family: 'Amatic SC', cursive; font-size: 2.2rem; font-weight: 700;
    color: var(--accent); letter-spacing: 1px;
  }
  .lab-logo span { color: var(--text); }
  .back-link {
    color: rgba(255,255,255,.55); text-decoration: none; font-size: .9rem;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent); }

  /* Card */
  .card {
    background: linear-gradient(165deg, var(--glass), var(--panel-b));
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
    margin-bottom: 20px;
  }

  /* Step labels */
  .step-label {
    font-size: .75rem; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  .card-title {
    font-size: 1.25rem; font-weight: 800; margin: 0 0 18px;
  }

  /* Inputs */
  .input-row { display: flex; gap: 10px; }
  input[type="text"], input[type="url"], select {
    flex: 1;
    background: rgba(0,0,0,.35); border: 1px solid var(--glass-border);
    border-radius: 10px; color: var(--text); padding: 11px 14px;
    font-size: 1rem; outline: none; width: 100%;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: rgba(255,255,255,.35); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 20px; border-radius: 10px; font-size: .95rem; font-weight: 700;
    cursor: pointer; border: none; transition: transform .15s, box-shadow .15s, filter .15s;
    text-decoration: none; white-space: nowrap;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; filter: none; }

  .btn-primary {
    background: linear-gradient(180deg, #fff 0%, #e6efe8 100%);
    color: var(--btnText);
    box-shadow: 0 8px 20px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .btn-spotify {
    background: var(--spotify); color: #fff;
    box-shadow: 0 8px 20px rgba(29,185,84,.35);
  }
  .btn-danger {
    background: rgba(255,80,80,.18); color: #ff8888;
    border: 1px solid rgba(255,80,80,.3);
  }
  .btn-convert {
    background: linear-gradient(135deg, var(--accent), #27ae60);
    color: #0a2e17; font-size: 1.1rem; padding: 14px 32px;
    box-shadow: 0 10px 30px rgba(46,204,113,.35);
    width: 100%;
    justify-content: center;
  }

  /* Spotify status badge */
  .spotify-status {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(29,185,84,.15); border: 1px solid rgba(29,185,84,.3);
    border-radius: 20px; padding: 5px 13px; font-size: .88rem; margin-top: 10px;
  }
  .spotify-status::before {
    content: ''; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--spotify);
  }

  /* Track preview list */
  .track-list { margin: 14px 0 0; }
  .track-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .track-item:last-child { border-bottom: none; }
  .track-thumb {
    width: 42px; height: 42px; border-radius: 6px; object-fit: cover;
    flex-shrink: 0; background: rgba(0,0,0,.3);
  }
  .track-thumb-placeholder {
    width: 42px; height: 42px; border-radius: 6px; flex-shrink: 0;
    background: rgba(255,255,255,.08);
  }
  .track-info { min-width: 0; }
  .track-title { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: .82rem; color: rgba(255,255,255,.55); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-more { padding: 10px 0 2px; font-size: .88rem; color: rgba(255,255,255,.45); }

  .playlist-meta {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
  }
  .playlist-name { font-size: 1.1rem; font-weight: 700; }
  .playlist-count { font-size: .85rem; color: rgba(255,255,255,.5); }

  /* Destination radio */
  .radio-group { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .radio-option {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.25); border: 1px solid var(--glass-border);
    border-radius: 10px; padding: 10px 16px; cursor: pointer;
    transition: border-color .2s, background .2s; flex: 1;
  }
  .radio-option:has(input:checked) {
    border-color: var(--accent); background: rgba(46,204,113,.1);
  }
  .radio-option input[type="radio"] { accent-color: var(--accent); }

  .dest-inner { margin-top: 12px; }

  /* Progress */
  .progress-bar-wrap {
    background: rgba(0,0,0,.35); border-radius: 20px; height: 10px;
    overflow: hidden; margin: 14px 0 8px;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 20px;
    background: linear-gradient(90deg, var(--accent), #27ae60);
    width: 0%; transition: width .3s ease;
  }
  .progress-meta { display: flex; justify-content: space-between; font-size: .85rem; color: rgba(255,255,255,.55); }

  /* Results */
  .result-stats { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat-chip {
    flex: 1; text-align: center; border-radius: 12px; padding: 14px 10px;
    border: 1px solid var(--glass-border);
  }
  .stat-chip.matched { background: rgba(29,185,84,.15); border-color: rgba(29,185,84,.3); }
  .stat-chip.missed  { background: rgba(255,80,80,.12);  border-color: rgba(255,80,80,.25); }
  .stat-num { font-size: 2rem; font-weight: 800; }
  .stat-label { font-size: .8rem; color: rgba(255,255,255,.55); margin-top: 4px; }
  .not-found-list { margin-top: 14px; }
  .not-found-list p { font-size: .9rem; color: rgba(255,255,255,.6); margin: 0 0 8px; }
  .not-found-list ul { margin: 0; padding-left: 18px; }
  .not-found-list li { font-size: .88rem; color: rgba(255,255,255,.5); margin-bottom: 3px; }
  .btn-open-spotify {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--spotify); color: #fff; border-radius: 10px;
    padding: 12px 22px; font-weight: 700; text-decoration: none;
    transition: filter .15s, transform .15s;
  }
  .btn-open-spotify:hover { filter: brightness(1.1); transform: translateY(-1px); }

  /* Error / loading */
  .error-msg {
    background: rgba(220,50,50,.2); border: 1px solid rgba(220,50,50,.4);
    border-radius: 10px; padding: 12px 16px; color: #ff9999;
    margin-bottom: 16px; font-size: .93rem;
  }
  .loading-msg {
    color: rgba(255,255,255,.55); font-size: .9rem; margin-top: 10px;
    display: none;
  }

  /* Convert CTA area */
  #convertSection { margin-top: 8px; }

  /* Divider */
  .divider { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 0 20px; }

  @media (max-width: 540px) {
    .input-row { flex-direction: column; }
    .result-stats { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="lab-header">
    <div class="lab-logo">Pickle <span>Lab</span></div>
    <a href="https://philliphinshaw.com" class="back-link">← Main Site</a>
  </header>

  <div id="errorMsg" class="error-msg" style="display:none"></div>

  <!-- Step 1: YouTube URL -->
  <div class="card">
    <div class="step-label">Step 1</div>
    <div class="card-title">Paste a YouTube Music Playlist URL</div>
    <div class="input-row">
      <input type="url" id="ytUrl" placeholder="https://music.youtube.com/playlist?list=..." />
      <button class="btn btn-primary" id="fetchBtn" onclick="fetchYouTubePlaylist()">Fetch</button>
    </div>
    <div id="loadingMsg" class="loading-msg"></div>
  </div>

  <!-- Step 2: Preview + Spotify connect -->
  <div id="previewSection" style="display:none">
    <div class="card">
      <div class="step-label">Found</div>
      <div class="playlist-meta">
        <div class="playlist-name" id="playlistTitle"></div>
        <div class="playlist-count" id="trackCount"></div>
      </div>
      <div class="track-list" id="trackList"></div>
    </div>

    <div class="card">
      <div class="step-label">Step 2</div>
      <div class="card-title">Connect Spotify</div>
      <button class="btn btn-spotify" id="connectSpotifyBtn" onclick="connectSpotify()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Connect Spotify
      </button>
      <button class="btn btn-danger" id="disconnectSpotifyBtn" onclick="disconnectSpotify()" style="display:none">Disconnect</button>
      <div id="spotifyStatus" class="spotify-status" style="display:none"></div>
    </div>

    <!-- Step 3: Destination -->
    <div class="card" id="destSection" style="display:none">
      <div class="step-label">Step 3</div>
      <div class="card-title">Choose Destination</div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="destMode" value="new" checked onchange="onDestModeChange()">
          Create new playlist
        </label>
        <label class="radio-option">
          <input type="radio" name="destMode" value="existing" onchange="onDestModeChange()">
          Add to existing playlist
        </label>
      </div>

      <div id="newPlaylistSection" class="dest-inner">
        <label style="font-size:.88rem;color:rgba(255,255,255,.55);display:block;margin-bottom:6px">Playlist name</label>
        <input type="text" id="newPlaylistName" placeholder="My Converted Playlist" />
      </div>
      <div id="existingPlaylistSection" class="dest-inner" style="display:none">
        <label style="font-size:.88rem;color:rgba(255,255,255,.55);display:block;margin-bottom:6px">Select playlist</label>
        <select id="existingPlaylistSelect"></select>
      </div>
    </div>

    <!-- Convert button -->
    <div id="convertSection" style="display:none">
      <button class="btn btn-convert" id="convertBtn" onclick="convertPlaylist()">
        Convert Playlist →
      </button>
    </div>

    <!-- Progress -->
    <div class="card" id="progressSection" style="display:none">
      <div class="card-title">Converting…</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-meta">
        <span id="progressLabel">Starting…</span>
        <span id="progressCount"></span>
      </div>
    </div>

    <!-- Results -->
    <div class="card" id="resultsSection" style="display:none">
      <div class="step-label">Done</div>
      <div class="card-title">Conversion Complete</div>
      <div class="result-stats">
        <div class="stat-chip matched">
          <div class="stat-num" id="resultMatched">0</div>
          <div class="stat-label">Tracks matched</div>
        </div>
        <div class="stat-chip missed">
          <div class="stat-num" id="resultNotFound">0</div>
          <div class="stat-label">Not found</div>
        </div>
      </div>
      <a id="spotifyLink" href="#" target="_blank" rel="noopener" class="btn-open-spotify">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Open in Spotify
      </a>
      <div class="not-found-list" id="notFoundList"></div>
    </div>
  </div>

</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// Replace this with your Spotify Client ID after creating a Developer app.
// The Client ID is not secret — it's safe to commit.
const SPOTIFY_CLIENT_ID = 'YOUR_SPOTIFY_CLIENT_ID';
const REDIRECT_URI = 'https://lab.philliphinshaw.com/';

// ── STATE ─────────────────────────────────────────────────────────────────────
let spotifyToken = null;
let spotifyUserId = null;
let existingPlaylists = [];
let youtubePlaylistData = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    showError('Spotify authorisation failed: ' + error);
  } else if (code) {
    await handleSpotifyCallback(code);
    window.history.replaceState({}, '', window.location.pathname);
  }

  const stored = localStorage.getItem('spotify_access_token');
  const expiresAt = parseInt(localStorage.getItem('spotify_expires_at') || '0');
  if (stored && expiresAt > Date.now() + 30000) {
    spotifyToken = stored;
    spotifyUserId = localStorage.getItem('spotify_user_id');
    await loadSpotifyUser();
  } else if (stored) {
    const ok = await refreshSpotifyToken();
    if (ok) await loadSpotifyUser();
  }

  updateSpotifyUI();
}

// ── PKCE HELPERS ──────────────────────────────────────────────────────────────
function generateCodeVerifier() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr = new Uint8Array(128);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(x => chars[x % chars.length]).join('');
}

async function generateCodeChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

// ── SPOTIFY AUTH ──────────────────────────────────────────────────────────────
async function connectSpotify() {
  if (SPOTIFY_CLIENT_ID === 'YOUR_SPOTIFY_CLIENT_ID') {
    showError('Spotify Client ID not set. Open lab/index.html and replace YOUR_SPOTIFY_CLIENT_ID with your actual Client ID from developer.spotify.com.');
    return;
  }
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('pkce_verifier', verifier);

  const params = new URLSearchParams({
    client_id: SPOTIFY_CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    scope: 'playlist-modify-public playlist-modify-private playlist-read-private user-read-private'
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params;
}

async function handleSpotifyCallback(code) {
  const verifier = localStorage.getItem('pkce_verifier');
  if (!verifier) { showError('OAuth session expired. Please try connecting again.'); return; }

  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: SPOTIFY_CLIENT_ID,
      code_verifier: verifier
    })
  });
  const data = await res.json();
  if (data.access_token) {
    storeSpotifyTokens(data);
  } else {
    showError('Could not get Spotify token: ' + (data.error_description || JSON.stringify(data)));
  }
}

async function refreshSpotifyToken() {
  const rt = localStorage.getItem('spotify_refresh_token');
  if (!rt) return false;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: rt,
      client_id: SPOTIFY_CLIENT_ID
    })
  });
  const data = await res.json();
  if (data.access_token) { storeSpotifyTokens(data); return true; }
  return false;
}

function storeSpotifyTokens(data) {
  spotifyToken = data.access_token;
  localStorage.setItem('spotify_access_token', data.access_token);
  if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
  localStorage.setItem('spotify_expires_at', (Date.now() + (data.expires_in || 3600) * 1000).toString());
}

function disconnectSpotify() {
  spotifyToken = null; spotifyUserId = null; existingPlaylists = [];
  ['spotify_access_token','spotify_refresh_token','spotify_expires_at','spotify_user_id','spotify_user_name']
    .forEach(k => localStorage.removeItem(k));
  updateSpotifyUI();
}

async function spotifyFetch(url, opts = {}) {
  const expiresAt = parseInt(localStorage.getItem('spotify_expires_at') || '0');
  if (expiresAt - Date.now() < 60000) {
    const ok = await refreshSpotifyToken();
    if (!ok) { disconnectSpotify(); throw new Error('Spotify session expired. Please reconnect.'); }
  }
  const res = await fetch(url, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + spotifyToken, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    const ok = await refreshSpotifyToken();
    if (!ok) { disconnectSpotify(); throw new Error('Spotify session expired. Please reconnect.'); }
    return spotifyFetch(url, opts);
  }
  return res;
}

async function loadSpotifyUser() {
  try {
    const res = await spotifyFetch('https://api.spotify.com/v1/me');
    const user = await res.json();
    spotifyUserId = user.id;
    localStorage.setItem('spotify_user_id', user.id);
    localStorage.setItem('spotify_user_name', user.display_name || user.id);

    const plRes = await spotifyFetch('https://api.spotify.com/v1/me/playlists?limit=50');
    const plData = await plRes.json();
    existingPlaylists = (plData.items || []).filter(p => p);
  } catch (e) {
    console.error('Error loading Spotify profile:', e);
  }
}

// ── YOUTUBE FETCH ─────────────────────────────────────────────────────────────
function extractPlaylistId(url) {
  try { return new URL(url).searchParams.get('list'); } catch { return null; }
}

async function fetchYouTubePlaylist() {
  const urlInput = document.getElementById('ytUrl').value.trim();
  const playlistId = extractPlaylistId(urlInput);
  if (!playlistId) { showError('Invalid URL — must contain ?list=… (e.g. https://music.youtube.com/playlist?list=PL…)'); return; }

  setLoading(true, 'Fetching playlist from YouTube…');
  try {
    const res = await fetch('/lab/api/youtube?playlistId=' + encodeURIComponent(playlistId));
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Failed to fetch playlist');
    youtubePlaylistData = data;
    renderTrackPreview(data);
  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

// ── TRACK PREVIEW ─────────────────────────────────────────────────────────────
function renderTrackPreview(data) {
  document.getElementById('playlistTitle').textContent = data.playlistTitle;
  document.getElementById('trackCount').textContent = data.tracks.length + ' tracks';
  document.getElementById('newPlaylistName').value = data.playlistTitle + ' (from YouTube)';

  const preview = data.tracks.slice(0, 5);
  document.getElementById('trackList').innerHTML =
    preview.map(t => `
      <div class="track-item">
        ${t.thumbnail
          ? `<img src="${t.thumbnail}" alt="" class="track-thumb">`
          : `<div class="track-thumb-placeholder"></div>`}
        <div class="track-info">
          <div class="track-title">${esc(t.title)}</div>
          <div class="track-artist">${esc(cleanChannel(t.channel))}</div>
        </div>
      </div>
    `).join('') +
    (data.tracks.length > 5
      ? `<div class="track-more">+${data.tracks.length - 5} more tracks</div>`
      : '');

  document.getElementById('previewSection').style.display = 'block';
  updateConvertButton();
}

function cleanChannel(ch) {
  return ch.replace(/ - Topic$/i, '').replace(/ - (Official|VEVO|Music)$/i, '');
}

function cleanTitle(title) {
  return title
    .replace(/\s*[\(\[](official\s*(music\s*|lyric\s*|audio\s*|)?video|lyrics?|audio|HD|4K|MV)[\)\]]/gi, '')
    .replace(/\s*-\s*(official|lyrics?|audio|video|HD|4K|MV)$/gi, '')
    .replace(/\s*[\(\[]ft\..*?[\)\]]/gi, '')
    .replace(/\s*[\(\[]feat\..*?[\)\]]/gi, '')
    .trim();
}

// ── CONVERSION ────────────────────────────────────────────────────────────────
async function convertPlaylist() {
  if (!youtubePlaylistData || !spotifyToken) return;

  const mode = document.querySelector('input[name="destMode"]:checked').value;
  document.getElementById('convertBtn').disabled = true;
  document.getElementById('progressSection').style.display = 'block';
  document.getElementById('resultsSection').style.display = 'none';

  try {
    let playlistId;
    if (mode === 'new') {
      const name = document.getElementById('newPlaylistName').value.trim() || youtubePlaylistData.playlistTitle;
      const res = await spotifyFetch(`https://api.spotify.com/v1/users/${spotifyUserId}/playlists`, {
        method: 'POST',
        body: JSON.stringify({ name, public: false, description: 'Converted from YouTube Music' })
      });
      const pl = await res.json();
      if (!pl.id) throw new Error('Failed to create playlist: ' + (pl.error?.message || JSON.stringify(pl)));
      playlistId = pl.id;
    } else {
      playlistId = document.getElementById('existingPlaylistSelect').value;
      if (!playlistId) throw new Error('Please select a playlist');
    }

    const tracks = youtubePlaylistData.tracks;
    const uris = [];
    const notFound = [];
    let done = 0;

    updateProgress(0, tracks.length, 'Searching Spotify…');

    for (const track of tracks) {
      const uri = await searchTrack(track);
      uri ? uris.push(uri) : notFound.push(track.title);
      done++;
      updateProgress(done, tracks.length, `Matched ${uris.length} of ${done}…`);
      if (done % 5 === 0) await sleep(100);
    }

    // Add in batches of 100 (Spotify limit)
    for (let i = 0; i < uris.length; i += 100) {
      await spotifyFetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks`, {
        method: 'POST',
        body: JSON.stringify({ uris: uris.slice(i, i + 100) })
      });
    }

    showResults(uris.length, notFound, playlistId);
  } catch (e) {
    showError('Conversion failed: ' + e.message);
    document.getElementById('convertBtn').disabled = false;
    document.getElementById('progressSection').style.display = 'none';
  }
}

async function searchTrack(track) {
  const title = cleanTitle(track.title);
  const artist = cleanChannel(track.channel);

  // Try precise search first, then title-only fallback
  const queries = artist
    ? [`track:${title} artist:${artist}`, title]
    : [title];

  for (const q of queries) {
    try {
      const res = await spotifyFetch(
        'https://api.spotify.com/v1/search?q=' + encodeURIComponent(q) + '&type=track&limit=1'
      );
      const data = await res.json();
      const uri = data.tracks?.items?.[0]?.uri;
      if (uri) return uri;
    } catch { /* try next query */ }
  }
  return null;
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function updateSpotifyUI() {
  const connected = !!spotifyToken;
  document.getElementById('connectSpotifyBtn').style.display    = connected ? 'none'         : 'inline-flex';
  document.getElementById('disconnectSpotifyBtn').style.display = connected ? 'inline-flex'  : 'none';

  const status = document.getElementById('spotifyStatus');
  if (connected) {
    status.textContent = 'Connected as ' + (localStorage.getItem('spotify_user_name') || 'Spotify');
    status.style.display = 'inline-flex';
  } else {
    status.style.display = 'none';
  }

  document.getElementById('destSection').style.display = connected ? 'block' : 'none';

  const sel = document.getElementById('existingPlaylistSelect');
  sel.innerHTML = existingPlaylists.map(p =>
    `<option value="${p.id}">${esc(p.name)} (${p.tracks?.total ?? 0} tracks)</option>`
  ).join('');

  updateConvertButton();
}

function updateConvertButton() {
  const show = !!(youtubePlaylistData && spotifyToken);
  document.getElementById('convertSection').style.display = show ? 'block' : 'none';
}

function onDestModeChange() {
  const mode = document.querySelector('input[name="destMode"]:checked').value;
  document.getElementById('newPlaylistSection').style.display      = mode === 'new'      ? 'block' : 'none';
  document.getElementById('existingPlaylistSection').style.display = mode === 'existing' ? 'block' : 'none';
}

function updateProgress(current, total, label) {
  document.getElementById('progressBar').style.width   = Math.round(current / total * 100) + '%';
  document.getElementById('progressLabel').textContent = label;
  document.getElementById('progressCount').textContent = `${current} / ${total}`;
}

function showResults(matched, notFound, playlistId) {
  document.getElementById('progressSection').style.display = 'none';
  document.getElementById('resultsSection').style.display  = 'block';
  document.getElementById('resultMatched').textContent     = matched;
  document.getElementById('resultNotFound').textContent    = notFound.length;
  document.getElementById('spotifyLink').href = 'https://open.spotify.com/playlist/' + playlistId;
  document.getElementById('notFoundList').innerHTML = notFound.length
    ? '<p>Not found on Spotify:</p><ul>' + notFound.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>'
    : '<p style="color:var(--accent)">All tracks matched!</p>';
}

function setLoading(on, msg = '') {
  document.getElementById('fetchBtn').disabled        = on;
  document.getElementById('loadingMsg').textContent   = msg;
  document.getElementById('loadingMsg').style.display = on ? 'block' : 'none';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 10000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── RUN ───────────────────────────────────────────────────────────────────────
init();
</script>
