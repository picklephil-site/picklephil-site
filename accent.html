<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Real Dill Phil's Accent Machine</title>
<meta name="description" content="Type anything, pick an accent, hear it spoken back. Free, instant, ridiculous." />
<link rel="icon" type="image/png" href="/img/favicon.png" />
<style>
:root{
  --bg:#0c3a22; --bg2:#1c8a4e; --bg3:#072a18;
  --text:#f5f7f5; --accent:#2ecc71;
  --btnText:#0d3d24; --radius:16px;
  --glass:rgba(255,255,255,.10); --glass-border:rgba(255,255,255,.22);
  --shadow:0 18px 45px rgba(0,0,0,.40);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Segoe UI',Tahoma,sans-serif; color:var(--text);
  background:
    radial-gradient(900px 600px at 78% 8%, rgba(46,204,113,.28), transparent 60%),
    radial-gradient(1100px 800px at 12% 0%, var(--bg2) 0%, transparent 55%),
    radial-gradient(circle at 50% 120%, #0f4a2c 0%, var(--bg3) 70%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg3) 100%);
  background-attachment:fixed; min-height:100vh; text-align:center;
  display:flex; flex-direction:column; align-items:center;
}
.wrap{width:min(700px,100%); padding:24px 18px;}
.back{display:inline-block; margin-bottom:16px; opacity:.65; font-size:.92rem; color:var(--text); text-decoration:none;}
.back:hover{opacity:1;}
h1{font-size:clamp(28px,6vw,48px); margin:0 0 6px; font-weight:900;}
.lead{font-size:1rem; opacity:.8; margin:0 auto 24px; max-width:480px; line-height:1.5;}

.card{
  background:linear-gradient(165deg,var(--glass),rgba(8,40,24,.28));
  border:1px solid var(--glass-border); border-radius:var(--radius);
  padding:26px 24px; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
  margin-bottom:16px; text-align:left;
}

.label{font-size:.82rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; opacity:.65; margin-bottom:8px; display:block;}

textarea{
  width:100%; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.35);
  color:var(--text); border-radius:12px; padding:14px 16px; font-size:1.05rem;
  font-family:inherit; resize:vertical; outline:none; min-height:130px; line-height:1.5;
  cursor:text; user-select:text; -webkit-user-select:text;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.25);
}
textarea::placeholder{opacity:.55; font-style:italic;}
textarea:focus{
  border-color:#2ecc71;
  background:rgba(255,255,255,.2);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.25), 0 0 0 3px rgba(46,204,113,.25);
}

.select-wrap{position:relative;}
select{
  width:100%; background:rgba(255,255,255,.1); border:1px solid var(--glass-border);
  color:var(--text); border-radius:12px; padding:12px 40px 12px 14px;
  font-size:.95rem; font-weight:600; font-family:inherit; outline:none;
  appearance:none; cursor:pointer;
}
select:focus{border-color:rgba(46,204,113,.6);}
select option{background:#1c4a2e; color:#fff;}
.select-wrap::after{
  content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%);
  pointer-events:none; opacity:.6; font-size:1.1rem;
}

.btn{
  color:var(--btnText); background:linear-gradient(180deg,#fff 0%,#e6efe8 100%);
  border:1px solid rgba(255,255,255,.6); border-radius:12px;
  padding:12px 24px; font-weight:800; font-size:.98rem; cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .15s, box-shadow .15s; margin:0; display:inline-block;
  text-decoration:none; width:100%; border:none;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,.34);}
.btn:active{transform:translateY(0); box-shadow:0 4px 10px rgba(0,0,0,.2);}
.btn:disabled{opacity:.45; cursor:default; transform:none !important; pointer-events:none;}
.btn--green{background:linear-gradient(180deg,#2ecc71,#27ae60); color:#fff;}
.btn--stop{background:linear-gradient(180deg,#e74c3c,#c0392b); color:#fff;}
.btn--dl{background:linear-gradient(180deg,#8e44ad,#6c3483); color:#fff; text-align:center;}

.speak-row{display:flex; gap:10px; margin-top:18px;}
.speak-row .btn{flex:1;}

/* Speaking animation */
.speaking-indicator{
  display:none; align-items:center; gap:10px; justify-content:center;
  margin-top:14px; font-weight:700; font-size:.95rem; opacity:.8;
}
.speaking-indicator.active{display:flex;}
.bars{display:flex; gap:3px; align-items:flex-end; height:24px;}
.bar{width:4px; border-radius:3px; background:#2ecc71; animation:barBounce 0.6s ease-in-out infinite;}
.bar:nth-child(1){height:8px; animation-delay:0s;}
.bar:nth-child(2){height:16px; animation-delay:.1s;}
.bar:nth-child(3){height:24px; animation-delay:.2s;}
.bar:nth-child(4){height:14px; animation-delay:.3s;}
.bar:nth-child(5){height:20px; animation-delay:.15s;}
@keyframes barBounce{
  0%,100%{transform:scaleY(0.4); opacity:.6;}
  50%{transform:scaleY(1); opacity:1;}
}

/* Accent / phrase grid */
.presets{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-top:14px;}
.preset-btn{
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
  color:var(--text); border-radius:12px; padding:10px 8px;
  font-size:.88rem; font-weight:700; cursor:pointer; transition:.18s;
  text-align:center; line-height:1.4;
}
.preset-btn:hover{background:rgba(46,204,113,.18); border-color:rgba(46,204,113,.4); transform:translateY(-2px);}
.preset-btn.active{background:rgba(46,204,113,.3); border-color:rgba(46,204,113,.7);}
.preset-btn .flag{font-size:1.4rem; display:block; margin-bottom:3px;}

.status-msg{font-size:.88rem; margin-top:10px; min-height:1.4em; opacity:.75; text-align:center;}
.status-msg.err{color:#ff8a8a; opacity:1;}

.input-field{
  width:100%; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.35);
  color:var(--text); border-radius:10px; padding:11px 14px; font-size:.95rem;
  font-family:inherit; outline:none; box-shadow:inset 0 2px 8px rgba(0,0,0,.25);
}
.input-field::placeholder{opacity:.55; font-style:italic;}
.input-field:focus{
  border-color:#2ecc71; background:rgba(255,255,255,.2);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.25), 0 0 0 3px rgba(46,204,113,.25);
}
.voice-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
  border-radius:8px; padding:5px 10px; font-size:.88rem;
}
.voice-chip button{
  background:none; border:none; color:var(--text); cursor:pointer;
  opacity:.5; font-size:.85rem; padding:0 2px; line-height:1;
}
.voice-chip button:hover{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to the Jar</a>

  <span style="font-size:3.5rem;display:block;margin-bottom:6px;">🗣️</span>
  <h1>Accent Machine</h1>
  <p class="lead">Type anything. Pick a real accent. Hear it spoken back — British, Australian, Indian, Irish and more. Totally free.</p>

  <div class="card">
    <label class="label" for="speech-text">✏️ Type what you want it to say</label>
    <textarea id="speech-text" placeholder="Click here and start typing… the more ridiculous the better." maxlength="500"></textarea>

    <div style="margin-top:16px;">
      <label class="label" for="voice-select">🌍 Pick an Accent</label>
      <div class="select-wrap">
        <select id="voice-select"></select>
      </div>
    </div>

    <div class="speak-row">
      <button class="btn btn--green" id="speak-btn" onclick="speakIt()">🔊 Say It!</button>
      <button class="btn btn--stop" id="stop-btn" onclick="stopIt()" style="display:none;">⏹ Stop</button>
    </div>

    <div class="speaking-indicator" id="speaking-indicator">
      <div class="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <span id="speaking-label">Speaking…</span>
    </div>

    <div class="status-msg" id="status-msg"></div>
  </div>

  <!-- Quick accent pick -->
  <div class="card">
    <span class="label">🌍 Quick Accent Buttons</span>
    <div class="presets" id="accent-presets"></div>
  </div>

  <!-- Quick phrases -->
  <div class="card">
    <span class="label">🎭 Quick Phrases — tap to load</span>
    <div class="presets" id="phrase-presets"></div>
  </div>


</div>

<script>
// Web Speech API — built into the browser, no network calls needed

var ACCENT_GROUPS = [
  { lang:'en-GB', flag:'🇬🇧', label:'British' },
  { lang:'en-AU', flag:'🇦🇺', label:'Australian' },
  { lang:'en-US', flag:'🇺🇸', label:'American' },
  { lang:'en-IN', flag:'🇮🇳', label:'Indian' },
  { lang:'de-DE', flag:'🇩🇪', label:'German' },
  { lang:'fr-FR', flag:'🇫🇷', label:'French' },
  { lang:'it-IT', flag:'🇮🇹', label:'Italian' },
  { lang:'es-ES', flag:'🇪🇸', label:'Spanish' },
  { lang:'ja-JP', flag:'🇯🇵', label:'Japanese' },
  { lang:'zh-CN', flag:'🇨🇳', label:'Chinese' },
];

var PHRASES = [
  { flag:'🥒', text:"I'm absolutely pickled with excitement, mate." },
  { flag:'🍔', text:"Can I get a number 3 with extra pickles please?" },
  { flag:'☕', text:"Good morning! Have you tried the artisanal cold brew?" },
  { flag:'🏈', text:"That quarterback just launched a sixty yard spiral!" },
  { flag:'🎩', text:"I say, that was a rather splendid performance, wasn't it?" },
  { flag:'🦘', text:"No worries mate, she'll be right." },
  { flag:'🌶️', text:"This is the most fire hot sauce I have ever tasted in my life!" },
  { flag:'👽', text:"We have detected an unusual pickle-based life form." },
  { flag:'💅', text:"Oh my god, did you SEE what she wore to the gala? Absolutely iconic." },
  { flag:'🎸', text:"Rock and roll all night and party every day!" },
];

var synth = window.speechSynthesis;
var selectedVoiceName = '';

function flagForLang(lang) {
  var g = ACCENT_GROUPS.find(function(x) { return lang && lang.startsWith(x.lang); });
  return g ? g.flag : '🌐';
}

function populateDropdown() {
  var voices = synth.getVoices();
  var sel = document.getElementById('voice-select');
  sel.innerHTML = '';

  // Group by language
  var map = {};
  voices.forEach(function(v) {
    if (!map[v.lang]) map[v.lang] = [];
    map[v.lang].push(v);
  });

  // English first, rest alphabetical
  var langs = Object.keys(map).sort(function(a, b) {
    var ae = a.startsWith('en') ? 0 : 1, be = b.startsWith('en') ? 0 : 1;
    return ae !== be ? ae - be : a.localeCompare(b);
  });

  langs.forEach(function(lang) {
    var grp = document.createElement('optgroup');
    grp.label = flagForLang(lang) + ' ' + lang;
    map[lang].forEach(function(v) {
      var opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });

  // Pick first en-GB, else first en-US, else first available
  var voices2 = synth.getVoices();
  var preferred = voices2.find(function(v) { return v.lang === 'en-GB'; }) ||
                  voices2.find(function(v) { return v.lang.startsWith('en'); }) ||
                  voices2[0];
  if (preferred) { sel.value = preferred.name; selectedVoiceName = preferred.name; }
  updateAccentButtons();
}

function init() {
  var sel = document.getElementById('voice-select');

  // Voices load async in some browsers
  if (synth.getVoices().length) {
    populateDropdown();
  } else {
    synth.onvoiceschanged = populateDropdown;
  }

  sel.addEventListener('change', function() {
    selectedVoiceName = this.value;
    updateAccentButtons();
  });

  // Quick accent buttons — pick first voice matching the language
  var ap = document.getElementById('accent-presets');
  ACCENT_GROUPS.forEach(function(group) {
    var btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.dataset.lang = group.lang;
    btn.innerHTML = '<span class="flag">' + group.flag + '</span>' + group.label;
    btn.addEventListener('click', function() {
      var match = synth.getVoices().find(function(v) { return v.lang === group.lang; }) ||
                  synth.getVoices().find(function(v) { return v.lang.startsWith(group.lang.split('-')[0]); });
      if (match) {
        selectedVoiceName = match.name;
        sel.value = match.name;
        updateAccentButtons();
        setStatus('');
      } else {
        setStatus('No ' + group.label + ' voice on this device.', true);
      }
    });
    ap.appendChild(btn);
  });
  updateAccentButtons();

  // Quick phrase buttons
  var pp = document.getElementById('phrase-presets');
  PHRASES.forEach(function(p) {
    var btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.innerHTML = '<span class="flag">' + p.flag + '</span>' + escHtml(p.text.slice(0, 28)) + (p.text.length > 28 ? '…' : '');
    btn.title = p.text;
    btn.addEventListener('click', function() {
      document.getElementById('speech-text').value = p.text;
      document.getElementById('speech-text').focus();
    });
    pp.appendChild(btn);
  });

  // Ctrl+Enter shortcut
  document.getElementById('speech-text').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') speakIt();
  });
}

function updateAccentButtons() {
  var voice = synth.getVoices().find(function(v) { return v.name === selectedVoiceName; });
  var lang = voice ? voice.lang : '';
  document.querySelectorAll('#accent-presets .preset-btn').forEach(function(btn) {
    btn.classList.toggle('active', lang.startsWith(btn.dataset.lang));
  });
}

function setStatus(msg, isErr) {
  var el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg' + (isErr ? ' err' : '');
}

function speakIt() {
  var text = document.getElementById('speech-text').value.trim();
  if (!text) {
    document.getElementById('speech-text').focus();
    setStatus('Type something first!', true);
    return;
  }

  synth.cancel();

  var utt = new SpeechSynthesisUtterance(text);
  var voice = synth.getVoices().find(function(v) { return v.name === selectedVoiceName; });
  if (voice) utt.voice = voice;

  utt.onstart = function() {
    document.getElementById('speak-btn').style.display = 'none';
    document.getElementById('stop-btn').style.display = 'block';
    document.getElementById('speaking-indicator').classList.add('active');
    document.getElementById('speaking-label').textContent = (voice ? voice.name : 'Voice') + ' is speaking…';
    setStatus('');
  };
  utt.onend = onDone;
  utt.onerror = function(e) {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    onDone();
    setStatus('⚠️ Could not speak — try again.', true);
  };

  synth.speak(utt);
}

function stopIt() {
  synth.cancel();
  onDone();
}

function onDone() {
  document.getElementById('speak-btn').style.display = 'block';
  document.getElementById('speak-btn').disabled = false;
  document.getElementById('stop-btn').style.display = 'none';
  document.getElementById('speaking-indicator').classList.remove('active');
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
