<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Word — Pickle Phil's Bible Reader</title>
<meta name="description" content="Read the Bible on Pickle Phil, powered by YouVersion."/>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0c3a22; --bg2:#1c8a4e; --bg3:#072a18;
  --text:#f5f7f5; --accent:#2ecc71; --btnText:#0d3d24;
  --radius:18px; --shadow:0 18px 45px rgba(0,0,0,.40);
  --glass:rgba(255,255,255,.10); --glass-border:rgba(255,255,255,.22);
  --panel-b:rgba(8,40,24,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:Segoe UI,Tahoma,sans-serif; color:var(--text);
  background:
    radial-gradient(900px 600px at 78% 8%, rgba(46,204,113,.28), transparent 60%),
    radial-gradient(1100px 800px at 12% 0%, var(--bg2) 0%, transparent 55%),
    radial-gradient(circle at 50% 120%, #0f4a2c 0%, var(--bg3) 70%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg3) 100%);
  background-attachment:fixed;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
}
.wrap{
  width:min(1100px,100%); padding:14px 22px 22px;
  display:flex; flex-direction:column; flex:1; min-height:100vh;
}

.btn{
  color:var(--btnText); text-decoration:none;
  background:linear-gradient(180deg,#ffffff 0%,#e6efe8 100%);
  padding:10px 18px; border-radius:12px; font-weight:700;
  display:inline-block; border:1px solid rgba(255,255,255,.6);
  box-shadow:0 8px 20px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .18s ease,box-shadow .18s ease;
  cursor:pointer; font-size:.95rem;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.38),0 0 0 2px rgba(46,204,113,.35),inset 0 1px 0 rgba(255,255,255,.9);}
.btn:active{transform:translateY(0);}
.btn.sm{padding:7px 13px; font-size:.85rem;}
.btn.ghost{
  background:rgba(255,255,255,.10); color:var(--text);
  border:1px solid var(--glass-border); box-shadow:none;
}
.btn.ghost:hover{background:rgba(255,255,255,.18);}

/* TOP NAV — kept deliberately thin so the reader starts as high as possible */
.topnav{display:flex;align-items:center;gap:8px;padding:6px 0 10px;flex-wrap:wrap;}
.topnav h1{
  font-family:"Amatic SC",sans-serif; font-size:2rem; font-weight:700; margin:0;
  background:linear-gradient(180deg,#ffffff,#c7f2d8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.topnav-right{margin-left:auto; display:flex; gap:8px; align-items:center;}

/* READER — YouVersion's own reader, with its own version and chapter controls */
.reader-card{
  background:linear-gradient(165deg,var(--glass),var(--panel-b));
  border:1px solid var(--glass-border); border-radius:var(--radius);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.18);
  overflow:hidden; position:relative;
  display:flex; flex-direction:column;
  flex:1; min-height:70vh;
}
.reader-frame{width:100%; flex:1; border:0; display:block; background:#fff;}
.reader-loading{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; padding:0 24px;
  text-align:center; background:rgba(8,40,24,.94); font-size:1.02rem; opacity:.9;
  transition:opacity .3s ease; pointer-events:none;
}
.reader-loading.hidden{opacity:0;}
.reader-loading .emoji{font-size:2.2rem;}
.reader-loading a{color:#c7f2d8;}

footer{margin:14px 0 18px;opacity:.7;font-size:.85rem;text-align:center;}
footer a{color:#c7f2d8;}
.footer-alt{margin-top:5px;font-size:.76rem;opacity:.55;}
.footer-alt a{color:inherit;text-decoration:underline;}
.footer-alt a:hover{opacity:.85;}

@media(max-width:700px){
  .wrap{padding:8px 10px 12px;}
  .topnav{padding:2px 0 8px; gap:6px;}
  .topnav h1{font-size:1.6rem;}
  .topnav-right{gap:6px;}
  .btn.sm{padding:6px 10px; font-size:.78rem;}
  .reader-card{min-height:76vh; border-radius:14px;}
  footer{margin:10px 0 14px; font-size:.8rem;}
}
</style>
</head>
<body>

<div class="wrap">
  <nav class="topnav">
    <h1>📖 The Word</h1>
    <div class="topnav-right">
      <a class="btn ghost sm" id="openYV" href="https://www.bible.com/" target="_blank" rel="noopener">Open in YouVersion ↗</a>
      <a class="btn ghost sm" href="/">← Home</a>
    </div>
  </nav>

  <div class="reader-card">
    <iframe id="reader" class="reader-frame" title="YouVersion Bible reader"
            referrerpolicy="no-referrer-when-downgrade"
            allow="clipboard-write"></iframe>
    <div class="reader-loading" id="readerLoading">
      <span class="emoji">📖</span>
      <span id="readerLoadingText">Loading the Word…</span>
    </div>
  </div>

  <footer>
    Powered by <a href="https://www.youversion.com/" target="_blank" rel="noopener">YouVersion</a>
    &nbsp;·&nbsp; Pickle Phil · Stay Crunchy 🥒
    <div class="footer-alt"><a href="/bible-classic.html">Prefer the classic reader?</a></div>
  </footer>
</div>

<script>
(function(){
  'use strict';

  // This page is a thin frame around YouVersion's own bible.com reader. That
  // reader carries its own version and chapter pickers, so this file only picks
  // the STARTING passage — anything after that happens inside the iframe, which
  // is cross-origin and deliberately not driven from here.
  var YV_BASE = 'https://www.bible.com/bible/';

  // Where the reader opens. Change these two to change the default translation.
  // ids verified on bible.com: NIV 111, NLT 116, NKJV 114, AMP 1588,
  // MSG 97, GNT 68 (Good News is 68 — 72 is HCSB).
  var DEFAULT_VERSION = 97;
  var DEFAULT_ABBREV  = 'MSG';
  var DEFAULT_BOOK    = 'JHN';
  var DEFAULT_CHAPTER = 3;

  // Book titles for resolving ?ref=John 3:16 into USFM. No chapter counts are
  // needed any more — bible.com handles navigation once the frame is loaded.
  var BOOKS = ('GEN:Genesis,EXO:Exodus,LEV:Leviticus,NUM:Numbers,DEU:Deuteronomy,JOS:Joshua,' +
    'JDG:Judges,RUT:Ruth,1SA:1 Samuel,2SA:2 Samuel,1KI:1 Kings,2KI:2 Kings,1CH:1 Chronicles,' +
    '2CH:2 Chronicles,EZR:Ezra,NEH:Nehemiah,EST:Esther,JOB:Job,PSA:Psalms,PRO:Proverbs,' +
    'ECC:Ecclesiastes,SNG:Song of Solomon,ISA:Isaiah,JER:Jeremiah,LAM:Lamentations,EZK:Ezekiel,' +
    'DAN:Daniel,HOS:Hosea,JOL:Joel,AMO:Amos,OBA:Obadiah,JON:Jonah,MIC:Micah,NAM:Nahum,' +
    'HAB:Habakkuk,ZEP:Zephaniah,HAG:Haggai,ZEC:Zechariah,MAL:Malachi,MAT:Matthew,MRK:Mark,' +
    'LUK:Luke,JHN:John,ACT:Acts,ROM:Romans,1CO:1 Corinthians,2CO:2 Corinthians,GAL:Galatians,' +
    'EPH:Ephesians,PHP:Philippians,COL:Colossians,1TH:1 Thessalonians,2TH:2 Thessalonians,' +
    '1TI:1 Timothy,2TI:2 Timothy,TIT:Titus,PHM:Philemon,HEB:Hebrews,JAS:James,1PE:1 Peter,' +
    '2PE:2 Peter,1JN:1 John,2JN:2 John,3JN:3 John,JUD:Jude,REV:Revelation').split(',')
    .map(function(row){ var p = row.split(':'); return { id:p[0], title:p[1] }; });

  // Names in common use that are not a prefix of the canon title above.
  var ALIASES = {
    'psalm':'PSA', 'psalms':'PSA', 'canticles':'SNG', 'song of songs':'SNG', 'songs':'SNG',
    'revelations':'REV', 'apocalypse':'REV', 'acts of the apostles':'ACT'
  };

  var reader     = document.getElementById('reader');
  var loader     = document.getElementById('readerLoading');
  var loaderText = document.getElementById('readerLoadingText');
  var openYV     = document.getElementById('openYV');

  // Accepts "John", "1 Peter", "Psalm", "I John", "1st Corinthians", or "JHN".
  function resolveBook(name){
    var n = String(name || '').toLowerCase().replace(/\./g,'').replace(/\s+/g,' ').trim();
    if (!n) return null;
    if (ALIASES[n]) return ALIASES[n];

    n = n.replace(/^i{1,3}\s+/, function(m){ return m.trim().length + ' '; })
         .replace(/^(\d)(?:st|nd|rd|th)\s+/, '$1 ');

    var i, title;
    for (i = 0; i < BOOKS.length; i++){
      if (BOOKS[i].id.toLowerCase() === n) return BOOKS[i].id;
    }
    for (i = 0; i < BOOKS.length; i++){
      if (BOOKS[i].title.toLowerCase() === n) return BOOKS[i].id;
    }
    for (i = 0; i < BOOKS.length; i++){
      title = BOOKS[i].title.toLowerCase();
      if (title.indexOf(n) === 0 || n.indexOf(title) === 0) return BOOKS[i].id;
    }
    return null;
  }

  // index.html's verse-of-the-day card and the journal widget both link here as
  // /bible.html?ref=John%203:16, so that has to keep working.
  function fromRefParam(){
    var ref = '';
    try { ref = new URLSearchParams(location.search).get('ref') || ''; } catch (e){}
    if (!ref) return null;

    var m = /^(.+?)\s+(\d+)(?::(\d+))?/.exec(ref.trim());
    if (!m) return null;
    var bookId = resolveBook(m[1]);
    if (!bookId) return null;

    return {
      versionId: DEFAULT_VERSION,
      abbrev: DEFAULT_ABBREV,
      bookId: bookId,
      chapter: parseInt(m[2], 10),
      verse: m[3] ? parseInt(m[3], 10) : null
    };
  }

  // Shareable deep links, e.g. #97/JHN.3 or #111/PSA.23.1
  function fromHash(){
    var m = /^#(\d+)\/([A-Za-z0-9]{3})\.(\d+)(?:\.(\d+))?$/.exec(location.hash || '');
    if (!m) return null;
    return {
      versionId: parseInt(m[1], 10),
      abbrev: '',
      bookId: m[2].toUpperCase(),
      chapter: parseInt(m[3], 10),
      verse: m[4] ? parseInt(m[4], 10) : null
    };
  }

  function startingPassage(){
    return fromRefParam() || fromHash() || {
      versionId: DEFAULT_VERSION,
      abbrev: DEFAULT_ABBREV,
      bookId: DEFAULT_BOOK,
      chapter: DEFAULT_CHAPTER,
      verse: null
    };
  }

  function buildUrl(p){
    var usfm = p.bookId + '.' + p.chapter + (p.verse ? '.' + p.verse : '');
    return YV_BASE + p.versionId + '/' + usfm + (p.abbrev ? '.' + p.abbrev : '');
  }

  var passage = startingPassage();
  var url = buildUrl(passage);

  var bookTitle = passage.bookId;
  BOOKS.forEach(function(b){ if (b.id === passage.bookId) bookTitle = b.title; });
  document.title = bookTitle + ' ' + passage.chapter +
                   (passage.verse ? ':' + passage.verse : '') + ' — The Word';

  reader.src = url;
  openYV.href = url;

  reader.addEventListener('load', function(){ loader.classList.add('hidden'); });

  // bible.com is a heavy page. If it still has not painted after 12s the usual
  // cause is a browser or extension blocking third-party frames, so offer a
  // direct link rather than leaving a spinner up forever.
  setTimeout(function(){
    if (loader.classList.contains('hidden')) return;
    loaderText.innerHTML = 'Still loading… if nothing appears, your browser may be blocking ' +
      'embedded frames — <a href="' + url + '" target="_blank" rel="noopener">' +
      'open this chapter on YouVersion ↗</a>';
    loader.style.pointerEvents = 'auto';
  }, 12000);

})();
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
