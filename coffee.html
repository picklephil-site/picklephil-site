<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pickle Phil's Brew Lab — Coffee &amp; Chai Drink Finder</title>
<meta name="description" content="Tell me your vibe — iced, hot, caramel, chai — and the Brew-O-Matic 3000 will spin up your perfect coffee or chai drink with a full recipe." />
<link rel="icon" type="image/png" href="/img/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0c3a22; --bg2:#1c8a4e; --bg3:#072a18;
  --text:#f5f7f5;
  --accent:#2ecc71;
  --btnText:#0d3d24;
  --radius:18px;
  --shadow:0 18px 45px rgba(0,0,0,.40);
  --glass:rgba(255,255,255,.10);
  --glass-border:rgba(255,255,255,.22);
  --gold:#FFD700;
  --caramel:#D4A056;
  --cream:#FFF3E0;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Segoe UI',Tahoma,sans-serif; color:var(--text);
  background:
    radial-gradient(900px 600px at 78% 8%, rgba(46,204,113,.28), transparent 60%),
    radial-gradient(1100px 800px at 12% 0%, var(--bg2) 0%, transparent 55%),
    radial-gradient(circle at 50% 120%, #0f4a2c 0%, var(--bg3) 70%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg3) 100%);
  background-attachment:fixed;
  min-height:100vh; text-align:center;
}
.wrap{width:min(880px,100%); margin:0 auto; padding:22px}

.farmhouse{
  font-family:"Amatic SC",system-ui,sans-serif;
  font-weight:700; letter-spacing:1px;
  font-size:clamp(46px,8vw,96px);
  line-height:1; margin:0 0 8px;
  background:linear-gradient(180deg,#ffffff 0%,#ffe0a0 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 2px 10px rgba(212,160,86,.35));
}
.lead{font-size:1.1rem; opacity:.92; margin:0 0 26px; max-width:560px; display:block; margin-inline:auto; margin-bottom:26px;}

/* ---- CARDS ---- */
.card{
  background:linear-gradient(165deg,var(--glass),rgba(8,40,24,.28));
  backdrop-filter:blur(14px) saturate(120%);
  -webkit-backdrop-filter:blur(14px) saturate(120%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:26px 24px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.18);
  margin-bottom:20px;
  text-align:left;
}

/* ---- TOGGLE BUTTONS ---- */
.pref-label{
  font-weight:700; font-size:.92rem; opacity:.8;
  text-transform:uppercase; letter-spacing:.5px;
  display:block; margin-bottom:8px;
}
.toggle-group{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.toggle-btn{
  padding:9px 18px; border-radius:30px;
  border:2px solid rgba(255,255,255,.28);
  background:transparent; color:var(--text);
  cursor:pointer; font-size:.95rem; font-weight:700;
  transition:all .2s; font-family:inherit;
}
.toggle-btn:hover{border-color:var(--accent); background:rgba(46,204,113,.15);}
.toggle-btn.active{background:var(--accent); border-color:var(--accent); color:var(--btnText);}

/* ---- FLAVOR CHIPS ---- */
.flavor-label-row{margin-bottom:8px;}
.flavor-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
.flavor-chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:7px 15px; border-radius:30px;
  border:2px solid rgba(255,255,255,.22);
  cursor:pointer; font-size:.9rem; font-weight:600;
  transition:all .2s; user-select:none;
}
.flavor-chip input[type="checkbox"]{
  position:absolute; opacity:0; pointer-events:none; width:0; height:0;
}
.flavor-chip:hover{border-color:var(--caramel); background:rgba(212,160,86,.12);}
.flavor-chip.checked{
  background:rgba(212,160,86,.22);
  border-color:var(--caramel);
  color:#FFE4A0;
}

/* ---- MAIN BUTTONS ---- */
.btn{
  color:var(--btnText);
  background:linear-gradient(180deg,#ffffff 0%,#e6efe8 100%);
  padding:13px 22px; border-radius:12px; font-weight:700; font-size:1rem;
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 8px 20px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .18s,box-shadow .18s,filter .18s;
  cursor:pointer; margin:6px; display:inline-block; text-decoration:none; font-family:inherit;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(0,0,0,.38),0 0 0 2px rgba(46,204,113,.35),inset 0 1px 0 rgba(255,255,255,.9);
  filter:brightness(1.02);
}
.btn:active{transform:translateY(0);}
.btn.big{font-size:1.25rem; padding:16px 30px;}
.btn.surprise{
  background:linear-gradient(180deg,#FFE066 0%,#D4A056 100%);
  color:#3a1f00; border-color:rgba(255,215,0,.5);
}
.btn.surprise:hover{box-shadow:0 14px 30px rgba(0,0,0,.38),0 0 0 2px rgba(255,215,0,.45),inset 0 1px 0 rgba(255,255,255,.9);}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important; filter:none !important;}

/* ---- SLOT MACHINE ---- */
.slot-wrap{display:none; margin:0 0 20px;}
.slot-wrap.visible{display:block; animation:fadeUp .35s ease;}

.slot-machine{
  background:linear-gradient(180deg,#2a1200 0%,#150900 45%,#2a1200 100%);
  border:3px solid var(--caramel);
  border-radius:20px; padding:22px 20px;
  box-shadow:
    0 0 0 1px rgba(212,160,86,.25),
    0 0 40px rgba(212,160,86,.2),
    0 24px 60px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;
}

.slot-machine-title{
  font-family:"Amatic SC",sans-serif;
  font-size:1.7rem; font-weight:700; letter-spacing:3px;
  color:var(--gold); margin:0 0 14px;
  text-shadow:0 0 12px rgba(255,215,0,.45);
}

/* Decorative lights strip */
.lights-strip{
  display:flex; justify-content:center;
  gap:7px; margin-bottom:14px;
}
.bulb{
  width:11px; height:11px; border-radius:50%;
  flex-shrink:0;
}
.bulb-y{background:#FFD700; box-shadow:0 0 5px #FFD700;}
.bulb-r{background:#ff4b4b; box-shadow:0 0 5px #ff4b4b;}
.bulb-g{background:#2ecc71; box-shadow:0 0 5px #2ecc71;}
.bulb-b{background:#4488ff; box-shadow:0 0 5px #4488ff;}

/* Flashing animation applied by JS class */
.lights-go .bulb:nth-child(odd){animation:blink-odd .38s ease infinite;}
.lights-go .bulb:nth-child(even){animation:blink-even .38s ease infinite;}
@keyframes blink-odd{0%,100%{opacity:1;filter:brightness(1.5)}50%{opacity:.2;filter:brightness(.5)}}
@keyframes blink-even{0%,100%{opacity:.2;filter:brightness(.5)}50%{opacity:1;filter:brightness(1.5)}}

/* The reel display window */
.reel-window{
  background:#080400;
  border:3px solid rgba(212,160,86,.55);
  border-radius:10px;
  height:96px;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  box-shadow:inset 0 0 30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,215,0,.1);
  max-width:600px; margin:0 auto;
}
/* CRT scanline effect */
.reel-window::after{
  content:"";
  position:absolute; inset:0; pointer-events:none; z-index:3;
  background:repeating-linear-gradient(
    0deg,
    transparent, transparent 3px,
    rgba(0,0,0,.12) 3px, rgba(0,0,0,.12) 4px
  );
}
/* Inner glow top/bottom vignette */
.reel-window::before{
  content:"";
  position:absolute; inset:0; pointer-events:none; z-index:2;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.5) 100%);
}
.reel-text{
  font-family:"Amatic SC",sans-serif;
  font-size:clamp(1.5rem,4vw,2.3rem);
  font-weight:700; color:#FFE0A0;
  text-align:center; padding:0 16px;
  position:relative; z-index:4;
  transition:filter .08s, transform .08s, opacity .08s;
  line-height:1.2;
}
.reel-text.spinning{
  filter:blur(2.5px) brightness(1.4);
  transform:scaleY(.82);
  opacity:.85;
}
.reel-text.landed{
  filter:none; transform:none; opacity:1;
  color:#FFE0A0;
  animation:reel-land .45s cubic-bezier(.17,.67,.35,1.3);
}
@keyframes reel-land{
  0%{transform:scale(1.18) translateY(-6px);opacity:.5}
  60%{transform:scale(1.04) translateY(1px);opacity:1}
  100%{transform:scale(1) translateY(0);opacity:1}
}

/* Winner / lights-win pulsing */
.lights-win .bulb{animation:win-pulse .6s ease infinite !important;}
@keyframes win-pulse{0%,100%{opacity:1;filter:brightness(2)}50%{opacity:.6;filter:brightness(.8)}}

.winner-banner{
  margin-top:12px; display:none;
  font-family:"Amatic SC",sans-serif;
  font-size:1.5rem; letter-spacing:3px;
  color:var(--gold); text-shadow:0 0 10px rgba(255,215,0,.5);
}
.winner-banner.show{display:block; animation:winner-drop .4s ease;}
@keyframes winner-drop{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ---- RESULT CARD ---- */
.result-card{
  background:linear-gradient(165deg,rgba(212,160,86,.12),rgba(8,40,24,.30));
  border:1px solid rgba(212,160,86,.3);
  border-radius:var(--radius);
  padding:28px 24px; text-align:left;
  display:none; margin-bottom:20px;
}
.result-card.show{display:block; animation:fadeUp .5s ease;}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

.result-drink-emoji{font-size:2.8rem; display:block; margin-bottom:8px;}
.result-name{
  font-family:"Amatic SC",sans-serif;
  font-size:clamp(2rem,6vw,3.2rem); font-weight:700;
  color:#FFE0A0; margin:0 0 4px; line-height:1.1;
}
.result-badges{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 14px;}
.badge{
  padding:4px 12px; border-radius:20px; font-size:.82rem; font-weight:700;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
}
.badge.iced{background:rgba(68,136,255,.2); border-color:rgba(68,136,255,.4); color:#aaccff;}
.badge.hot{background:rgba(255,100,50,.2); border-color:rgba(255,100,50,.4); color:#ffb088;}
.badge.coffee{background:rgba(139,94,60,.25); border-color:rgba(139,94,60,.5); color:#d4a870;}
.badge.chai{background:rgba(100,60,160,.2); border-color:rgba(100,60,160,.4); color:#c8a0ff;}

.result-desc{opacity:.9; line-height:1.65; margin:0 0 18px; font-size:1rem;}

.ingredients-section-title{
  font-size:.88rem; font-weight:800; opacity:.75; text-transform:uppercase;
  letter-spacing:.6px; margin:0 0 10px;
}
.ingredients-list{list-style:none; padding:0; margin:0 0 18px;}
.ingredients-list li{
  display:flex; justify-content:space-between; align-items:center;
  padding:9px 14px; border-radius:9px; margin:4px 0;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
}
.ing-name{font-weight:600; font-size:.95rem;}
.ing-amount{
  color:var(--caramel); font-weight:700; font-size:.88rem;
  background:rgba(212,160,86,.14); padding:2px 10px; border-radius:6px;
  white-space:nowrap; margin-left:12px;
}

.result-tip{
  background:rgba(46,204,113,.08);
  border-left:3px solid var(--accent);
  padding:11px 15px; border-radius:0 9px 9px 0;
  font-size:.92rem; line-height:1.55; opacity:.9; margin-top:4px;
}

/* ---- MISC ---- */
footer{margin:40px 0 16px; opacity:.75; font-size:.9rem;}
a,a:visited{color:var(--text); text-decoration:none;}

@media(max-width:580px){
  .card{padding:20px 16px;}
  .toggle-btn{padding:7px 13px; font-size:.88rem;}
  .btn.big{font-size:1.05rem; padding:13px 22px;}
  .ingredients-list li{flex-direction:column; align-items:flex-start; gap:4px;}
  .ing-amount{margin-left:0;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div style="margin:10px 0 4px; font-size:3.8rem; line-height:1;">☕</div>
  <h1 class="farmhouse">The Brew Lab</h1>
  <span class="lead">Tell me your vibe and I'll spin up the perfect coffee or chai for you — ingredients and all.</span>

  <!-- PREFERENCES CARD -->
  <div class="card" id="prefsCard">
    <h2 style="margin:0 0 20px; font-size:1.25rem; font-weight:800;">⚙️ Set Your Brew Preferences</h2>

      <label class="flavor-chip" id="chip-chocolate">

  <!-- SLOT MACHINE -->
  <div class="slot-wrap" id="slotWrap">

      <div class="reel-window">

      <div class="lights-strip" id="lightsStrip2" style="margin-top:14px;margin-bottom:0;">
        <span class="bulb bulb-g"></span>

        <span class="bulb bulb-y"></span>

        <span class="bulb bulb-y"></span>
        <span class="bulb bulb-r"></span>
        <span class="bulb bulb-b"></span>
        <span class="bulb bulb-g"></span>
        <span class="bulb bulb-y"></span>
        <span class="bulb bulb-r"></span>

      </div>

      <div class="winner-banner" id="winnerBanner">🏆 &nbsp; YOUR BREW IS READY &nbsp; 🏆</div>

  <!-- RESULT CARD -->

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// ============================================================
// DRINKS DATABASE
// ============================================================
var DRINKS = [

  // ── ICED COFFEE ──────────────────────────────────────────
  {
    name:"Iced Caramel Macchiato", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["caramel","vanilla"],
    description:"Layers of vanilla-sweetened milk, bold espresso poured on top, and a generous caramel drizzle — all over ice. The classic order that converted half the coffee world.",
    ingredients:[
      {item:"Espresso",amount:"2 shots (2 oz)"},
      {item:"Vanilla syrup",amount:"2 tbsp"},
      {item:"Milk of choice",amount:"¾ cup (6 oz)"},
      {item:"Ice",amount:"1 cup"},
      {item:"Caramel drizzle",amount:"1–2 tbsp"}
    ],
    tip:"Pour the espresso over the top last — don't stir immediately. The layers mixing as you drink is the whole experience. Use a tall glass so you can see those gorgeous layers."
  },
  {
    name:"Iced Caramel Latte", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["caramel"],
    description:"Smooth espresso stirred with caramel syrup and poured over cold milk and ice. Bolder caramel punch than a macchiato — simpler, punchier, equally delicious.",
    ingredients:[
      {item:"Espresso",amount:"2 shots (2 oz)"},
      {item:"Caramel syrup",amount:"2–3 tbsp"},
      {item:"Milk of choice",amount:"¾ cup (6 oz)"},
      {item:"Ice",amount:"1 cup"},
      {item:"Caramel drizzle",amount:"1 tbsp (optional)"}
    ],
    tip:"Stir the caramel syrup into the hot espresso before adding milk and ice — it dissolves completely and distributes evenly."
  },
  {
    name:"Iced Vanilla Latte", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["vanilla"],
    description:"Silky, sweet, and effortlessly smooth. Vanilla syrup rounds out espresso's bitterness into a drink you could sip all afternoon.",
    ingredients:[
      {item:"Espresso",amount:"2 shots (2 oz)"},
      {item:"Vanilla syrup",amount:"2 tbsp"},
      {item:"Milk of choice",amount:"¾ cup (6 oz)"},
      {item:"Ice",amount:"1 cup"}
    ],
    tip:"Swap regular milk for oat milk — the natural sweetness of oat milk complements vanilla perfectly and makes it noticeably creamier."
  },
  {
    name:"Iced Mocha", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["chocolate"],
    description:"Espresso meets chocolate in this cold classic. Rich, indulgent, and still refreshing — the flavor combo that proves coffee and chocolate were made for each other.",
    ingredients:[
      {item:"Espresso",amount:"2 shots (2 oz)"},
      {item:"Chocolate sauce",amount:"2 tbsp"},
      {item:"Milk of choice",amount:"¾ cup (6 oz)"},
      {item:"Ice",amount:"1 cup"},
      {item:"Whipped cream",amount:"optional"}
    ],
    tip:"Use a real chocolate sauce (not just Hershey's syrup) for a noticeably richer, deeper chocolate flavor that holds up against the espresso."
  },
  {
    name:"Cold Brew Coffee", emoji:"🧋", temp:"iced", type:"coffee",
    flavors:["classic"],
    description:"Steeped 18–24 hours in cold water for a smooth, low-acid concentrate that's naturally sweet and never bitter. The drink that changed how America does iced coffee.",
    ingredients:[
      {item:"Coarse ground coffee",amount:"1 cup (4 oz)"},
      {item:"Cold filtered water",amount:"4 cups (32 oz)"},
      {item:"Ice",amount:"1 cup"},
      {item:"Milk or cream",amount:"to taste"}
    ],
    tip:"Steep in the fridge for 18–24 hours for the best flavor. Always use coarse grind — fine grounds make it muddy and bitter."
  },
  {
    name:"Iced Brown Sugar Oat Shaken Espresso", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["brown-sugar","cinnamon"],
    description:"Three espresso shots shaken hard with brown sugar syrup and cinnamon, then topped with oat milk. The shaking aerates it into a frothy, silky drink that's borderline addictive.",
    ingredients:[
      {item:"Espresso",amount:"3 shots (3 oz)"},
      {item:"Brown sugar syrup",amount:"2 tbsp"},
      {item:"Cinnamon",amount:"¼ tsp"},
      {item:"Ice",amount:"1 cup"},
      {item:"Oat milk",amount:"½ cup (4 oz)"}
    ],
    tip:"Shake the espresso, brown sugar syrup, and a handful of ice HARD in a cocktail shaker for at least 20 seconds. That foam on top is non-negotiable."
  },
  {
    name:"Iced Hazelnut Latte", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["hazelnut"],
    description:"Nutty, smooth, and subtly sweet. Hazelnut syrup gives this iced latte a warm, toasted depth that lingers in the best way.",
    ingredients:[
      {item:"Espresso",amount:"2 shots (2 oz)"},
      {item:"Hazelnut syrup",amount:"2 tbsp"},
      {item:"Milk of choice",amount:"¾ cup (6 oz)"},
      {item:"Ice",amount:"1 cup"}
    ],
    tip:"Try Torani Toasted Hazelnut syrup — the 'toasted' version is richer and more authentic-tasting than standard hazelnut."
  },
  {
    name:"Iced Cinnamon Dolce Latte", emoji:"☕", temp:"iced", type:"coffee",
    flavors:["cinnamon","vanilla"],
    description:"Sweet cinnamon spice and espresso over ice — the cinnamon dolce syrup adds a warmth that feels cozy even when served cold.",
    ingredients:[
      {item:"Espresso",amount:"2 shots (2 oz)"},
      {item:"Cinnamon dolce syrup",amount:"2 tbsp"},
      {item:"Milk of choice",amount:"¾ cup (6 oz)"},
      {item:"Ice",amount:"1 cup"},

// ============================================================
// STATE
// ============================================================
var selectedTemp = 'iced';
var selectedType = 'coffee';
var isSpinning = false;
var spinTimer = null;

// ============================================================
// TOGGLE GROUPS
// ============================================================
function setupToggle(groupId, onSelect) {
  var group = document.getElementById(groupId);
  group.querySelectorAll('.toggle-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      group.querySelectorAll('.toggle-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      onSelect(btn.dataset.val);
    });
  });
}
setupToggle('tempGroup', function(v){ selectedTemp = v; });
setupToggle('typeGroup', function(v){ selectedType = v; });

// ============================================================
// FLAVOR CHIPS
// ============================================================
document.querySelectorAll('.flavor-chip').forEach(function(chip) {
  chip.addEventListener('click', function(e) {
    // Let the native label+checkbox handling fire first, then sync class
    setTimeout(function() {
      var cb = chip.querySelector('input[type="checkbox"]');
      chip.classList.toggle('checked', cb.checked);
    }, 0);
  });
});

function getSelectedFlavors() {
  return Array.from(document.querySelectorAll('.flavor-chip input:checked')).map(function(cb){ return cb.value; });
}

// ============================================================
// DRINK FILTERING
// ============================================================
function pickDrink(surprise) {
  if (surprise) {
    return DRINKS[Math.floor(Math.random() * DRINKS.length)];
  }

  var flavors = getSelectedFlavors();

  var pool = DRINKS.filter(function(d) {
    if (selectedTemp !== 'any' && d.temp !== selectedTemp) return false;
    if (selectedType !== 'any' && d.type !== selectedType) return false;
    return true;
  });

  // Fall back to full list if nothing matches
  if (!pool.length) pool = DRINKS.slice();

  if (flavors.length > 0) {
    var scored = pool.map(function(d) {
      return { drink: d, score: d.flavors.filter(function(f){ return flavors.includes(f); }).length };
    });
    var best = Math.max.apply(null, scored.map(function(s){ return s.score; }));
    if (best > 0) {
      var top = scored.filter(function(s){ return s.score === best; });
      return top[Math.floor(Math.random() * top.length)].drink;
    }
  }

  return pool[Math.floor(Math.random() * pool.length)];
}

// ============================================================
// SLOT MACHINE
// ============================================================
var reelTextEl  = document.getElementById('reelText');
var slotWrapEl  = document.getElementById('slotWrap');
var lightsEl    = document.getElementById('lightsStrip');
var lightsEl2   = document.getElementById('lightsStrip2');
var winnerEl    = document.getElementById('winnerBanner');
var resultEl    = document.getElementById('resultCard');
var findBtn     = document.getElementById('findBtn');
var surpriseBtn = document.getElementById('surpriseBtn');

var allDisplayNames = DRINKS.map(function(d){ return d.emoji + ' ' + d.name; });

function setLights(mode) {
  [lightsEl, lightsEl2].forEach(function(el) {
    el.classList.remove('lights-go', 'lights-win');
    if (mode) el.classList.add(mode);
  });
}

function startSpin(targetDrink) {
  if (isSpinning) return;
  isSpinning = true;
  findBtn.disabled = true;
  surpriseBtn.disabled = true;

  // Show machine, hide previous result
  slotWrapEl.classList.add('visible');
  resultEl.classList.remove('show');
  winnerEl.classList.remove('show');
  reelTextEl.classList.remove('landed');
  reelTextEl.classList.add('spinning');
  setLights('lights-go');

  var ticks = 0;
  var fastCount = 24;  // rapid-fire phase

  function tick() {
    var name = allDisplayNames[Math.floor(Math.random() * allDisplayNames.length)];
    reelTextEl.textContent = name;
    ticks++;

    var delay;
    if (ticks <= fastCount) {
      delay = 60;
    } else if (ticks <= fastCount + 7) {
      delay = 90 + (ticks - fastCount) * 60; // 150 → 510
    } else {
      // Land!
      reelTextEl.textContent = targetDrink.emoji + ' ' + targetDrink.name;
      reelTextEl.classList.remove('spinning');
      reelTextEl.classList.add('landed');
      setLights('lights-win');

      setTimeout(function() {
        winnerEl.classList.add('show');
        setTimeout(function() { showResult(targetDrink); }, 550);
      }, 380);

      isSpinning = false;
      findBtn.disabled = false;
      surpriseBtn.disabled = false;
      return;
    }

    spinTimer = setTimeout(tick, delay);
  }

  tick();
}

// ============================================================
// RESULT DISPLAY
// ============================================================
function showResult(drink) {
  document.getElementById('resultEmoji').textContent = drink.emoji;
  document.getElementById('resultName').textContent = drink.name;

  var badges = document.getElementById('resultBadges');
  badges.innerHTML =
    '<span class="badge ' + drink.temp + '">' + (drink.temp === 'iced' ? '🧊 Iced' : '🔥 Hot') + '</span>' +
    '<span class="badge ' + drink.type + '">' + (drink.type === 'coffee' ? '☕ Coffee' : '🍵 Chai') + '</span>';

  document.getElementById('resultDesc').textContent = drink.description;

  var list = document.getElementById('ingredientsList');
  list.innerHTML = drink.ingredients.map(function(i) {
    return '<li><span class="ing-name">' + i.item + '</span><span class="ing-amount">' + i.amount + '</span></li>';
  }).join('');

  document.getElementById('resultTip').innerHTML = '💡 <strong>Pro Tip:</strong> ' + drink.tip;

  resultEl.classList.add('show');
  resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ============================================================
// TRY AGAIN — RESET
// ============================================================
document.getElementById('tryAgainBtn').addEventListener('click', function() {
  resultEl.classList.remove('show');
  winnerEl.classList.remove('show');
  slotWrapEl.classList.remove('visible');
  reelTextEl.classList.remove('landed','spinning');
  reelTextEl.textContent = 'Insert coin…';
  setLights(null);
  window.scrollTo({ top:0, behavior:'smooth' });
});

// ============================================================
// BUTTON WIRING
// ============================================================
findBtn.addEventListener('click', function() { startSpin(pickDrink(false)); });
surpriseBtn.addEventListener('click', function() { startSpin(pickDrink(true)); });
</script>
